name: Sertifikat Webinar Pengampuan

# Berjalan setiap 5 menit pada 23 s.d. 25 November (UTC), mencakup seluruh hari acara 24 November 2026 WIB.
# Sertifikat dikirim sekitar 15 menit setelah peserta mengisi daftar hadir.
on:
  schedule:
    - cron: '*/5 * 23-25 11 *'
  push:
    paths:
      - 'sertifikat-webinar/uji.txt'
  workflow_dispatch:
    inputs:
      uji_email:
        description: 'Kirim contoh sertifikat ke email ini (kosongkan untuk proses biasa)'
        required: false
        default: ''
      uji_nama:
        description: 'Nama pada sertifikat uji coba (opsional)'
        required: false
        default: ''
      mode:
        description: 'biasa = hanya peserta terdaftar; pratinjau = buat PDF tanpa mengirim; kirim-semua = kirim ke semua pengisi daftar hadir'
        required: false
        default: 'biasa'
        type: choice
        options: [biasa, pratinjau, kirim-semua]

permissions:
  contents: write

concurrency:
  group: sertifikat-webinar
  cancel-in-progress: false

jobs:
  kirim:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: sertifikat-webinar
    env:
      URL_VERIFIKASI: https://sertifikat-bhp-medan.cf-layar.workers.dev
      JEDA_MENIT: ${{ (github.event.inputs.mode == 'pratinjau' || github.event.inputs.mode == 'kirim-semua') && '0' || '15' }}
      SEMUA: ${{ (github.event.inputs.mode == 'pratinjau' || github.event.inputs.mode == 'kirim-semua') && '1' || '' }}
      KERING: ${{ github.event.inputs.mode == 'pratinjau' && '1' || '' }}
      GAS_URL: https://script.google.com/macros/s/AKfycbxmeAy52VtAFQDenyAgEaUjCFa449vXUpFy-fNw_8sOIk8FuhDstCIM3qcMqCpyzsYj/exec
      UJI_NAMA: ${{ github.event.inputs.uji_nama }}
      UJI_EMAIL: ${{ github.event.inputs.uji_email || (github.event_name == 'push' && 'wilayah2bhpmedan@gmail.com') || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Cek jadwal
        id: jadwal
        run: |
          now=$(date -u +%s)
          mulai=$(date -u -d '2026-11-23T17:00:00Z' +%s)
          selesai=$(date -u -d '2026-11-25T17:00:00Z' +%s)
          if [ -n "$UJI_EMAIL" ] || { [ $now -ge $mulai ] && [ $now -le $selesai ]; }; then echo "jalan=1" >> $GITHUB_OUTPUT; else echo "Di luar jadwal"; fi
      - uses: actions/setup-node@v4
        if: steps.jadwal.outputs.jalan == '1'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sertifikat-webinar/package-lock.json
      - name: Pasang paket
        if: steps.jadwal.outputs.jalan == '1'
        run: npm ci --no-audit --no-fund
      - name: Kirim sertifikat
        if: steps.jadwal.outputs.jalan == '1'
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SERTIFIKAT_KODE: ${{ secrets.SERTIFIKAT_KODE }}
          JOTFORM_API_KEY: ${{ secrets.JOTFORM_API_KEY }}
        run: node kirim.mjs
      - name: Kunci pratinjau
        if: steps.jadwal.outputs.jalan == '1' && env.KERING == '1'
        run: |
          tar -czf p.tgz keluaran
          openssl rand -out k.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in p.tgz -out pratinjau.enc -pass file:k.bin
          openssl pkeyutl -encrypt -pubin -inkey kunci-pratinjau.pem -pkeyopt rsa_padding_mode:oaep -in k.bin -out kunci.enc
          rm -rf keluaran p.tgz k.bin
      - uses: actions/upload-artifact@v4
        if: steps.jadwal.outputs.jalan == '1' && env.KERING == '1'
        with:
          name: pratinjau
          path: |
            sertifikat-webinar/pratinjau.enc
            sertifikat-webinar/kunci.enc
          retention-days: 1
      - name: Simpan status
        if: always() && steps.jadwal.outputs.jalan == '1' && env.KERING != '1'
        run: |
          git config user.name "sertifikat-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data situs
          if ! git diff --cached --quiet; then
            git commit -m "Sertifikat webinar: perbarui status pengiriman"
            for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
          fi
