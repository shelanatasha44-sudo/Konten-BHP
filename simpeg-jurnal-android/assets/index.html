<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jurnal SIMPEG</title>
<style>
:root{--bg:#f3f4f8;--surface:#fff;--fg:#17203a;--muted:#5b6478;--line:#e3e6ef;--navy:#1f2d5a;--merah:#c0182e;--merah-soft:#fdecee;--ok:#15803d;--ok-soft:#e8f6ee;--warn:#b45309;--warn-soft:#fdf3e4;--chip:#eef1f8}
@media (prefers-color-scheme:dark){:root{--bg:#0e1322;--surface:#161d30;--fg:#eaedf6;--muted:#9aa3bd;--line:#27304a;--navy:#3a4d87;--merah:#ff6072;--merah-soft:#2a1620;--ok:#4ade80;--ok-soft:#10261a;--warn:#fbbf24;--warn-soft:#2a2112;--chip:#1d2540;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,Roboto,sans-serif;padding:0 16px 40px}
.wrap{max-width:560px;margin:0 auto}
header{position:sticky;top:0;background:var(--bg);padding:14px 0 10px;z-index:5}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.15rem}
.brand .dot{width:26px;height:26px;border-radius:7px;background:var(--merah);display:grid;place-items:center;color:#fff;font-size:.9rem}
.sub{color:var(--muted);font-size:.82rem;margin:2px 0 10px}
.tabs{display:flex;gap:6px;background:var(--chip);border-radius:12px;padding:4px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;font-size:.88rem;padding:8px 4px;border-radius:9px}
.tabs button.on{background:var(--navy);color:#fff}
.tabs input[type=date]{flex:1.2;min-width:0;border:0;border-radius:9px;background:var(--surface);color:var(--fg);font:inherit;font-size:.82rem;padding:6px}
.tgl{display:flex;align-items:baseline;gap:8px;margin-top:10px}.tgl span{color:var(--muted);font-size:.86rem}
.pill{margin-left:auto;font-size:.74rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--merah-soft);color:var(--merah)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin:10px 0;font-size:.88rem}
.box.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.box.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.box.err{background:var(--merah-soft);border-color:transparent;color:var(--merah)}
.box b{color:inherit}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:9px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.no{width:22px;height:22px;flex:none;border-radius:7px;background:var(--navy);color:#fff;font-size:.78rem;font-weight:800;display:grid;place-items:center}
.skp{font-size:.72rem;font-weight:700;color:var(--merah);text-transform:uppercase;letter-spacing:.03em}
.jam{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;font-size:.88rem}
.keg{font-size:.95rem;font-weight:600}.meta{font-size:.8rem;color:var(--muted);margin-top:4px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font:inherit;font-weight:800;margin-top:8px;background:var(--navy);color:#fff}
.btn.merah{background:var(--merah)}.btn.garis{background:transparent;color:var(--fg);border:1px solid var(--line);font-weight:700}
.row{display:flex;gap:8px}.row .btn{flex:1}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 13px;margin-top:12px}
summary{font-weight:700;cursor:pointer}
label{display:block;font-size:.82rem;font-weight:700;margin:10px 0 3px}
input[type=text],input[type=time],input[type=number],textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:9px;background:transparent;color:inherit;font:inherit}
textarea{min-height:80px;font-size:.8rem;font-family:ui-monospace,monospace}
.cek{display:flex;gap:8px;align-items:center;font-weight:400;font-size:.9rem}
pre{white-space:pre-wrap;word-break:break-word;font-size:.7rem;max-height:320px;overflow:auto;background:var(--chip);padding:8px;border-radius:8px}
.libur{text-align:center;color:var(--muted);padding:26px 10px}
.foot{font-size:.8rem;color:var(--muted);margin-top:14px;line-height:1.65}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0 4px}
.chip{border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:8px 2px;font:inherit;text-align:center;line-height:1.25}
.chip b{display:block;font-size:.95rem}.chip small{display:block;font-size:.7rem;color:var(--muted)}
.chip .st{font-size:.8rem;margin-top:2px}
.chip.on{border-color:var(--merah);background:var(--merah-soft)}
.chip:disabled{opacity:.45}
.besar{font-size:1.05rem;padding:16px}
.hint{font-size:.78rem;color:var(--muted);text-align:center;margin-top:6px}
.mini{font-size:.82rem}.mini .card{padding:9px 11px}
</style></head>
<body><div class="wrap">
<header>
  <div class="brand"><span class="dot">✓</span> Jurnal SIMPEG</div>
  <div class="sub">Pilih tanggal, tekan tombol merah. Selesai.</div>
</header>

<div id="layanan"></div>
<div id="info"></div>

<div class="chips" id="chips"></div>
<button class="btn merah besar" id="mulai">▶ Isi</button>
<button class="btn garis" id="henti" style="display:none">■ Hentikan</button>
<div class="hint" id="hint"></div>

<details id="lihat"><summary>📋 Lihat kegiatan yang akan diisi</summary><div class="mini" id="isi"></div></details>

<details id="atur"><summary>⚙ Pengaturan</summary>
  <label class="cek"><input type="checkbox" id="satu"> ⚡ Mode cepat: 1 kegiatan per hari (07:30–16:30)</label>
  <label class="cek"><input type="checkbox" id="pengingat"> Ingatkan tiap hari kerja (notifikasi)</label>
  <label>Jam pengingat</label><input type="time" id="jam">
  <label>Masa tutup SIMPEG tiap bulan (tanggal dari–sampai)</label>
  <div class="row"><input type="number" id="tutupDari" min="1" max="31"><input type="number" id="tutupSampai" min="1" max="31"></div>
  <label>Hari libur / cuti (satu per baris, yyyy-mm-dd)</label><textarea id="liburSaya"></textarea>
  <label>Teks pilihan SKP (kosong = pilihan nomor 1)</label><input type="text" id="teksSkp">
  <label>Nama paket aplikasi SIMPEG</label><input type="text" id="paket">
  <button class="btn" id="simpanAtur">Simpan pengaturan</button>
  <div class="row"><button class="btn garis" id="uji">Uji 1 form</button><button class="btn garis" id="tandai">Tandai tgl terpilih sudah</button></div>
</details>

<details id="diag"><summary>🩺 Log</summary>
  <label class="cek"><input type="checkbox" id="rekam"> Rekam isi layar (untuk perbaikan bila macet)</label>
  <div class="row"><button class="btn garis" id="lihatLog">Lihat</button><button class="btn garis" id="bagiLog">Bagikan</button><button class="btn garis" id="hapusLog">Hapus</button></div>
  <pre id="log" style="display:none"></pre>
</details>
<div class="foot">Selama mengisi, jangan sentuh HP sampai muncul notifikasi selesai. HP harus sudah login di aplikasi SIMPEG.</div>
</div>
<script src="kegiatan.js"></script>
<script>
var J = self.JurnalBHP, A = window.Android || null;
var HARI = ['Min','Sen','Sel','Rab','Kam',"Jum",'Sab'];
var BULAN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
var GESER = [-3,-2,-1,0,1], cfg = J.DEFAULTS, pilih = null;
function $(id){return document.getElementById(id);}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}
function simpanan(k,b){try{return JSON.parse(localStorage.getItem(k))||b;}catch(e){return b;}}
function taruh(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function hIni(){return J.iso(new Date());}
function status(){return A ? JSON.parse(A.status()) : {};}

function susunCfg(){
  var atur = simpanan('atur', {});
  var c = Object.assign({}, J.DEFAULTS);
  if ('tutupDari' in atur) c.masaTutup = (atur.tutupDari && atur.tutupSampai) ? {dari:atur.tutupDari, sampai:atur.tutupSampai} : null;
  c.libur = (c.libur||[]).concat(atur.liburSaya||[]);
  c.satuKegiatan = atur.satu !== false;
  cfg = J.gabungRemote(c, simpanan('dataRemote', null));
  cfg.satuKegiatan = c.satuKegiatan;
  if (cfg.masaTutup) cfg.masaTutup = J.tutupDari(cfg);
}
function kirimAtur(){
  var atur = simpanan('atur', {});
  if (!A) return;
  A.simpanPengaturan(JSON.stringify({
    paket: atur.paket || 'simpeg.kemenkumham.mobile', jam: atur.jam || '08:15', pengingat: atur.pengingat !== false,
    tutupDari: cfg.masaTutup ? cfg.masaTutup.dari : 0, tutupSampai: cfg.masaTutup ? cfg.masaTutup.sampai : 0,
    libur: (cfg.libur||[]).join(','), teksSkp: atur.teksSkp || ''
  }));
}
function perbaruiData(){
  fetch(J.DATA_URL + '?t=' + Date.now(), {cache:'no-store'}).then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(d){ if (J.validBank(d.bank)) { taruh('dataRemote', d); susunCfg(); kirimAtur(); tampil(); } })
    .catch(function(){});
}

/** Pilihan bawaan: H dan H+1 yang hari kerja dan belum lengkap (+ susulan masa tutup bila ada). */
function pilihanBawaan(){
  var st = status(), h = hIni(), p = {};
  [h, J.addDays(h,1)].forEach(function(t){ if (J.hariKerja(t, cfg) && !st['lengkap:'+t]) p[t] = true; });
  J.tanggalSusulan(h, cfg).forEach(function(t){ if (J.hariKerja(t, cfg) && !st['lengkap:'+t]) p[t] = true; });
  var maju = J.majuOtomatis(h, cfg) && J.isiMajuTutup(h, cfg);
  if (maju) maju.forEach(function(t){ if (!st['lengkap:'+t]) p[t] = true; });
  return p;
}
function terpilih(){ return Object.keys(pilih).filter(function(t){ return pilih[t]; }).sort(); }

function tampil(){
  var st = status(), h = hIni();
  var aktif = A ? A.layananAktif() : false, jalan = A ? A.sedangJalan() : false;
  var lay = $('layanan'); lay.textContent = '';
  if (!aktif) {
    var b = el('div','box err'); b.innerHTML = '<b>Izin aksesibilitas belum aktif.</b> ';
    var tb = el('button','btn merah','Aktifkan sekarang'); tb.onclick=function(){A&&A.bukaSetelan();};
    b.appendChild(tb); lay.appendChild(b);
  }
  var info = $('info'); info.textContent = '';
  if (J.dalamMasaTutup(h, cfg)) info.appendChild(el('div','box warn','🔒 SIMPEG sedang ditutup (tgl '+cfg.masaTutup.dari+'–'+cfg.masaTutup.sampai+').'));
  var maju = J.isiMajuTutup(h, cfg);
  if (maju && !jalan) {
    var bm = el('div','box warn','📅 Besok SIMPEG ditutup s.d. tgl '+cfg.masaTutup.sampai+'. ');
    var tbm = el('button','btn merah','▶ Isi sekalian s.d. tgl '+(+maju[maju.length-1].slice(8)));
    tbm.onclick = function(){ mulai(true, maju); };
    bm.appendChild(tbm); info.appendChild(bm);
  }
  if (jalan) info.appendChild(el('div','box','⏳ Sedang mengisi… jangan sentuh HP.'));

  // pilihan tanggal
  var wadah = $('chips'); wadah.textContent = '';
  GESER.forEach(function(g){
    var t = J.addDays(h, g), d = new Date(t+'T00:00'), kerja = J.hariKerja(t, cfg), lengkap = st['lengkap:'+t];
    var c = el('button','chip'+(pilih[t]?' on':''));
    c.appendChild(el('b', null, g===0?'H':g<0?'H'+g:'H+'+g));
    c.appendChild(el('small', null, HARI[d.getDay()]+' '+d.getDate()+' '+BULAN[d.getMonth()]));
    c.appendChild(el('div','st', !kerja ? 'libur' : lengkap ? '✅' : pilih[t] ? '●' : '○'));
    c.disabled = !kerja || jalan;
    c.onclick = function(){ pilih[t] = !pilih[t]; tampil(); };
    wadah.appendChild(c);
  });
  var tg = terpilih();
  $('mulai').textContent = tg.length ? '▶ Isi ' + tg.length + ' hari (' + tg.map(function(t){return +t.slice(8);}).join(', ') + ')' : 'Pilih tanggal dulu';
  $('mulai').disabled = !tg.length || jalan;
  $('mulai').style.display = jalan ? 'none' : 'block';
  $('henti').style.display = jalan ? 'block' : 'none';
  $('hint').textContent = tg.some(function(t){ return t < J.addDays(h,-1); }) ? '⚠ SIMPEG biasanya hanya menerima H-1, H, H+1. H-2/H-3 bisa ditolak.' : (cfg.satuKegiatan ? '⚡ 1 kegiatan per hari, 07:30–16:30' : '');

  var isi = $('isi'); isi.textContent = '';
  tg.forEach(function(t){
    isi.appendChild(el('div','meta', t));
    J.susunJurnal(t, cfg).forEach(function(k){
      var c = el('div','card'), top = el('div','top');
      top.appendChild(el('span','skp',k.skp==='Lain-Lain'?'Lain-lain':'SKP no. 1'));
      top.appendChild(el('span','jam',k.jamMulai+'–'+k.jamSelesai));
      c.appendChild(top); c.appendChild(el('div','keg',k.uraian));
      c.appendChild(el('div','meta','Jumlah '+k.volume+' '+k.satuan));
      isi.appendChild(c);
    });
  });
}

function mulai(simpan, daftar){
  var urut = (daftar || terpilih()).filter(function(t){ return J.hariKerja(t, cfg); });
  if (!simpan) urut = urut.slice(0, 1);
  if (!urut.length) { A&&A.pesan('Pilih tanggal hari kerja dulu.'); return; }
  if (simpan && J.dalamMasaTutup(hIni(), cfg) && !confirm('SIMPEG sedang masa tutup. Penyimpanan kemungkinan ditolak. Tetap coba?')) return;
  var semua = [];
  urut.forEach(function(d){ semua = semua.concat(J.susunJurnal(d, cfg)); });
  var r = A ? A.mulai(urut.join(','), JSON.stringify(semua), simpan) : 'Buka di aplikasi Android.';
  if (r) alert(r);
  setTimeout(tampil, 600);
}
window.cekMulaiOtomatis = function(){ var t = A ? A.mulaiOtomatis() : ''; if (t) { pilih = pilihanBawaan(); tampil(); mulai(true); } };
window.segarkan = function(){ tampil(); };

$('mulai').onclick = function(){ mulai(true); };
$('uji').onclick = function(){ mulai(false); };
$('henti').onclick = function(){ A&&A.hentikan(); setTimeout(tampil,300); };
$('tandai').onclick = function(){ if (!A) return; var st = status(); terpilih().forEach(function(t){ A.tandai(t, !st['lengkap:'+t]); }); pilih = pilihanBawaan(); tampil(); };

function isiAtur(){
  var a = simpanan('atur', {});
  $('satu').checked = a.satu !== false;
  $('pengingat').checked = a.pengingat !== false; $('jam').value = a.jam || '08:15';
  $('tutupDari').value = cfg.masaTutup ? cfg.masaTutup.dari : ''; $('tutupSampai').value = cfg.masaTutup ? cfg.masaTutup.sampai : '';
  $('paket').value = a.paket || 'simpeg.kemenkumham.mobile'; $('teksSkp').value = a.teksSkp || '';
  $('liburSaya').value = (a.liburSaya||[]).join('\n');
  $('rekam').checked = A ? !!status().rekam : false;
}
$('simpanAtur').onclick = function(){
  taruh('atur', { satu: $('satu').checked, pengingat: $('pengingat').checked, jam: $('jam').value || '08:15',
    tutupDari: +$('tutupDari').value || 0, tutupSampai: +$('tutupSampai').value || 0,
    paket: $('paket').value.trim() || 'simpeg.kemenkumham.mobile', teksSkp: $('teksSkp').value.trim(),
    liburSaya: $('liburSaya').value.split('\n').map(function(x){return x.trim();}).filter(function(x){return /^\d{4}-\d{2}-\d{2}$/.test(x);}) });
  susunCfg(); kirimAtur(); tampil(); A&&A.pesan('Pengaturan tersimpan.');
};
$('rekam').onchange = function(){ A&&A.rekam(this.checked); };
$('lihatLog').onclick = function(){ var p=$('log'); p.style.display='block'; p.textContent = (A?A.log():'') || '(log kosong)'; p.scrollTop = p.scrollHeight; };
$('bagiLog').onclick = function(){ A&&A.bagikanLog(); };
$('hapusLog').onclick = function(){ A&&A.hapusLog(); $('log').textContent=''; };

susunCfg(); pilih = pilihanBawaan(); isiAtur(); kirimAtur(); tampil(); perbaruiData();
setInterval(function(){ if (A && A.sedangJalan()) tampil(); }, 3000);
setTimeout(window.cekMulaiOtomatis, 400);
</script>
</body></html>
