<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin E-Sertifikat | Kanwil Kemenkum Sumatera Utara</title>
<link rel="icon" href="/img/logo.png">
<link rel="stylesheet" href="/css/gaya.css">
<style>
  .admin{width:100%;max-width:1180px;margin:0 auto;padding:22px 20px 40px;display:grid;grid-template-columns:240px minmax(0,1fr);gap:22px;align-items:start}
  .menu{position:sticky;top:16px;background:#fff;border:1px solid var(--garis);border-radius:18px;padding:10px;box-shadow:var(--bayang)}
  .menu .judul-menu{font-size:11px;letter-spacing:.2em;color:var(--redup);font-weight:600;padding:10px 12px 6px}
  .menu a{display:flex;gap:11px;align-items:center;padding:10px 12px;border-radius:11px;color:var(--lembut);font-weight:600;font-size:14px;text-decoration:none}
  .menu a:hover{background:var(--latar)}
  .menu a.aktif{background:var(--navy);color:#fff}
  .menu a svg{width:18px;height:18px;flex:none}
  .ikon{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .kepala{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  .kepala h1{font-family:Cinzel,serif;font-size:22px;color:var(--navy);letter-spacing:.02em}
  .kembali{display:none;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--lembut);margin-bottom:8px}
  .aktif-kartu{background:radial-gradient(120% 140% at 0% 0%,var(--navy2),var(--navy) 55%,var(--navy3));color:#fff;border-radius:18px;padding:20px 22px;box-shadow:var(--bayang);position:relative;overflow:hidden}
  .aktif-kartu::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;border:1px solid rgba(227,199,122,.25)}
  .aktif-kartu .label{color:var(--emas2)}
  .aktif-kartu h2{font-family:Cinzel,serif;font-size:19px;line-height:1.3;margin-top:6px}
  .aktif-kartu .meta{color:#CFD6EA;font-size:13px;margin-top:4px}
  .aktif-kartu .baris{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;flex-wrap:wrap}
  .angka{font-family:Cinzel,serif;font-weight:700;font-size:26px;color:var(--emas2);line-height:1}
  .angka small{display:block;font-family:Inter,sans-serif;font-size:11.5px;font-weight:500;color:#CFD6EA;margin-top:4px;letter-spacing:.02em}
  .saklar{display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,.1);border:1px solid rgba(227,199,122,.4);color:#fff;border-radius:999px;padding:7px 14px 7px 8px;font-weight:600;font-size:13px;cursor:pointer}
  .saklar i{width:34px;height:20px;border-radius:999px;background:#7C86A8;position:relative;transition:background .2s}
  .saklar i::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .2s}
  .saklar.on i{background:#3BA776}
  .saklar.on i::after{left:17px}
  .ubin{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
  .ubin a{background:#fff;border:1px solid var(--garis);border-radius:16px;padding:16px;text-decoration:none;color:var(--teks);display:flex;flex-direction:column;gap:8px;box-shadow:0 6px 18px rgba(31,42,90,.05);transition:transform .1s,border-color .15s}
  .ubin a:hover{border-color:var(--emas);transform:translateY(-1px)}
  .ubin .bulat{width:38px;height:38px;border-radius:12px;background:var(--emas-lembut);color:#8A6A1E;display:flex;align-items:center;justify-content:center}
  .ubin .bulat svg{width:20px;height:20px}
  .ubin b{font-size:14.5px;color:var(--navy)}
  .ubin small{font-size:12px;color:var(--redup);line-height:1.35}
  .tautan-kecil{display:flex;gap:8px 16px;flex-wrap:wrap;justify-content:center;margin-top:14px;font-size:13px}
  .tombol-pratinjau{display:none}
  .dua-kolom{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
  .pilih{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .pilih label{border:2px solid var(--garis);border-radius:14px;padding:7px;cursor:pointer;text-align:center;font-size:12.5px;font-weight:600;display:flex;flex-direction:column;gap:6px;background:#fff}
  .pilih input{display:none}
  .pilih label:has(input:checked){border-color:var(--emas);box-shadow:0 0 0 3px rgba(201,161,59,.18)}
  .pilih img,.pilih .kosong{width:100%;aspect-ratio:297/210;object-fit:cover;border-radius:8px;border:1px solid var(--garis)}
  .pilih .kosong{display:flex;flex-direction:column;align-items:center;justify-content:center;border-style:dashed;color:var(--redup);font-size:11px;background:#FCFBF7}
  .pilih .kosong b{font-size:22px;color:var(--emas);line-height:1}
  .panel{border:1px dashed #D3CBB8;border-radius:14px;padding:12px 14px;background:#FCFBF7;margin-top:12px}
  .warna{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .warna label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
  .warna input{width:42px;height:32px;border:1px solid #DAD3C2;border-radius:8px;padding:2px;background:#fff}
  details.lain{margin-top:12px;border-top:1px solid var(--garis);padding-top:10px}
  details.lain summary{cursor:pointer;font-weight:600;font-size:13.5px;color:var(--lembut)}
  details.lain[open] summary{margin-bottom:10px}
  .daftar-peserta{display:flex;flex-direction:column;gap:8px;margin-top:10px}
  .pes{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--garis);border-radius:14px;padding:11px 12px}
  .pes .no{width:34px;height:34px;flex:none;border-radius:10px;background:var(--latar);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--navy);font-size:13px}
  .pes .isi{flex:1;min-width:0}
  .pes .isi b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pes .isi small{display:block;font-size:12px;color:var(--redup);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pes.dicabut{opacity:.55}
  .pes .aksi{display:flex;gap:6px;flex:none}
  .qr-besar{background:#fff;border:1px solid var(--garis);border-radius:16px;padding:14px;text-align:center}
  .qr-besar canvas{width:220px;height:220px;margin:0 auto}
  .pes input.pilihP{width:18px;height:18px;flex:none;accent-color:var(--navy);cursor:pointer}
  .pes.dipilih{border-color:var(--emas);background:#FFFCF3}
  .alat{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px;padding:10px 12px;border:1px solid var(--garis);border-radius:12px;background:#FCFBF7}
  .alat .centang{font-weight:600;color:var(--navy)}
  .rekap-ins{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px}
  .rekap-ins th,.rekap-ins td{border-bottom:1px solid var(--garis);padding:7px 6px;text-align:left}
  .rekap-ins th{font-size:12px;color:var(--redup);font-weight:600;letter-spacing:.04em}
  .rekap-ins td.n,.rekap-ins th.n{text-align:right;width:70px}
  .isian-baris{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:10px;border:1px solid var(--garis);border-radius:12px;background:#fff}
  .isian-baris textarea{grid-column:1 / -1}
  .isian-baris .centang{font-size:13px;white-space:nowrap}
  .cepat{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  select{width:100%;padding:10px 12px;border:1px solid #DAD3C2;border-radius:10px;background:#fff;font:inherit;font-size:14px;color:var(--teks)}
  .proses{position:fixed;inset:0;background:rgba(20,26,50,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
  .proses .kartu{max-width:360px;width:100%;text-align:center}
  .proses .bar{height:8px;border-radius:99px;background:var(--latar);overflow:hidden;margin-top:12px}
  .proses .bar i{display:block;height:100%;width:0;background:var(--emas);transition:width .2s}
  @media (max-width:600px){.isian-baris{grid-template-columns:minmax(0,1fr) auto auto}.isian-baris input[type=text]{grid-column:1 / -1}}
  .masuk{max-width:420px;margin:34px auto}
  .masuk .lencana{width:64px;height:64px;margin:0 auto 6px}
  @media (max-width:860px){
    .admin{grid-template-columns:minmax(0,1fr);padding:12px 12px 20px;gap:0}
    .menu{display:none}
    .kembali{display:inline-flex}
    .kepala h1{font-size:18px}
    .kepala{margin-bottom:10px}
    .kartu{padding:16px 14px;border-radius:16px}
    .ubin{grid-template-columns:repeat(2,1fr);gap:9px;margin-top:10px}
    .ubin a{padding:12px;gap:6px;border-radius:14px}
    .ubin .bulat{width:32px;height:32px;border-radius:10px}
    .ubin small{display:none}
    .aktif-kartu{padding:16px}
    .aktif-kartu h2{font-size:16px}
    .dua-kolom{grid-template-columns:1fr;gap:10px}
    .kolom{gap:10px}
    label.isian{font-size:13px;gap:5px}
    label.isian small{display:none}
    input[type=text],input[type=email],input[type=password],input[type=datetime-local],input[type=search],textarea{padding:10px 12px;font-size:16px}
    .kaki{display:none}
    .kop .isi{padding:8px 14px}
    .kop img{width:30px}
    .qr-besar canvas{width:180px;height:180px}
    .pratinjau-kecil{max-width:360px;margin:0 auto}
    .lipat-hp .pratinjau-kecil,.lipat-hp .ket-pratinjau{display:none}
    .lipat-hp .tombol-pratinjau{display:inline-flex}
    .qr-besar canvas{width:150px;height:150px}
    .sembunyi-hp{display:none}
  }
</style>
</head>
<body>
<header class="kop"><div class="isi">
  <a href="/"><img src="/img/logo.png" alt="Logo Kementerian Hukum"></a>
  <div class="nama"><small>KANWIL KEMENKUM SUMATERA UTARA</small><b>Admin E-Sertifikat</b></div>
  <nav><a href="/" target="_blank" rel="noopener">Halaman Absen</a><a href="#" id="keluar" class="tersembunyi">Keluar</a></nav>
</div></header>

<div class="admin" id="kerangka">
  <aside class="menu tersembunyi" id="menu"></aside>
  <main id="layar"><div style="text-align:center;padding:40px;color:var(--redup)"><span class="memuat"></span></div></main>
</div>

<dialog id="dialog"><form class="kartu" method="dialog" id="formDialog"></form></dialog>
<div class="proses tersembunyi" id="proses"><div class="kartu"><b id="prosesJudul">Menyiapkan sertifikat</b><p class="kecil" id="prosesKet" style="margin-top:6px"></p><div class="bar"><i id="prosesBar"></i></div></div></div>

<footer class="kaki"><b>Kantor Wilayah Kementerian Hukum Sumatera Utara</b><br>Admin Sertifikat Elektronik</footer>

<script src="/lib/qrcode.js"></script>
<script src="/lib/jspdf.umd.min.js"></script>
<script src="/js/umum.js"></script>
<script src="/js/sertifikat.js"></script>
<script>
const $ = (s, el) => (el || document).querySelector(s);
const esc = Umum.esc;
const layar = $('#layar');
const ROMAWI = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII'];
const IKON = {
  ringkas: '<path d="M4 13h6V4H4zM14 20h6v-9h-6zM14 4v4h6V4zM4 20h6v-4H4z"/>',
  kegiatan: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/>',
  desain: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 15l3-3 3 3 2-2 3 3"/><circle cx="9" cy="9" r="1.3"/>',
  ttd: '<rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><path d="M14 14h2v2h-2zM18 18h2v2h-2zM14 18h2"/>',
  peserta: '<circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.8-3 3-4.6 5.5-4.6s4.7 1.6 5.5 4.6M16 11a2.6 2.6 0 1 0 0-5.2M17.5 14.6c1.6.5 2.6 1.9 3 4.4"/>',
  bagikan: '<circle cx="18" cy="5.5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="18.5" r="2.5"/><path d="M8.2 10.8l7.6-4.1M8.2 13.2l7.6 4.1"/>',
  email: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M4 7l8 6 8-6"/>',
  semua: '<path d="M4 6h16M4 12h16M4 18h10"/>',
  sandi: '<rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
  isian: '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
};
const ikon = (n) => `<svg viewBox="0 0 24 24" class="ikon">${IKON[n]}</svg>`;
const MENU = [
  ['', 'ringkas', 'Ringkasan'], ['kegiatan', 'kegiatan', 'Data Kegiatan'], ['isian', 'isian', 'Isian Absen'], ['desain', 'desain', 'Desain Sertifikat'], ['ttd', 'ttd', 'Pengesahan dan QR'],
  ['peserta', 'peserta', 'Peserta'], ['bagikan', 'bagikan', 'Bagikan Absen'], ['email', 'email', 'Email Otomatis'], ['semua', 'semua', 'Semua Kegiatan'], ['sandi', 'sandi', 'Kata Sandi'],
];
let acara = null, peserta = [], aturEmail = null;

function kepala(judul, aksi) {
  return `<a class="kembali" href="#/">&larr; Menu</a><div class="kepala"><h1>${judul}</h1>${aksi || ''}</div>`;
}
function gambarMenu(rute) {
  $('#menu').innerHTML = '<div class="judul-menu">MENU ADMIN</div>' + MENU.map(([r, i, t]) => `<a href="#/${r}" class="${r === rute ? 'aktif' : ''}">${ikon(i)}${t}</a>`).join('');
}
async function simpanAcara(ubah) {
  const d = await Umum.api('/api/acara/' + acara.id, { method: 'PUT', body: { ...acara, ...ubah } });
  acara = (await Umum.api('/api/acara/' + d.id)).acara;
}
async function muatAktif() {
  acara = (await Umum.api('/api/aktif')).acara;
  peserta = acara ? (await Umum.api('/api/peserta/' + acara.id)).peserta : [];
}

// ---------------- masuk ----------------
async function layarMasuk(pesan) {
  $('#menu').classList.add('tersembunyi'); $('#keluar').classList.add('tersembunyi');
  const st = await Umum.api('/api/status-admin').catch(() => ({ perluDibuat: false }));
  const buat = st.perluDibuat;
  layar.innerHTML = `<form class="kartu masuk" id="formMasuk">
    <div class="lencana"><svg viewBox="0 0 88 88" style="width:100%;height:100%;fill:none;stroke:var(--emas);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round"><circle cx="44" cy="44" r="40" style="fill:rgba(201,161,59,.1)"/><rect x="31" y="40" width="26" height="19" rx="3"/><path d="M36 40v-6a8 8 0 0 1 16 0v6"/></svg></div>
    <h2 style="text-align:center">${buat ? 'Buat Kata Sandi Admin' : 'Masuk Admin'}</h2>
    <p class="ket" style="text-align:center;margin:6px 0 16px">${buat ? 'Kata sandi ini dipakai setiap kali masuk ke halaman admin.' : 'Khusus panitia pengelola sertifikat.'}</p>
    <div class="kolom">
      <input type="password" id="sandi" placeholder="Kata sandi" autocomplete="${buat ? 'new-password' : 'current-password'}" required>
      ${buat ? '<input type="password" id="sandi2" placeholder="Ulangi kata sandi" autocomplete="new-password" required>' : ''}
      <button class="tombol emas lebar" type="submit">${buat ? 'Simpan dan Masuk' : 'Masuk'}</button>
    </div>
    ${pesan ? `<div class="pesan galat">${esc(pesan)}</div>` : ''}
  </form>`;
  $('#formMasuk').addEventListener('submit', async (e) => {
    e.preventDefault();
    const s = $('#sandi').value;
    try {
      let d;
      if (buat) {
        if (s !== $('#sandi2').value) return layarMasuk('Kedua kata sandi tidak sama.');
        d = await Umum.api('/api/sandi', { method: 'POST', body: { baru: s } });
      } else d = await Umum.api('/api/masuk', { method: 'POST', body: { sandi: s } });
      Umum.kode.simpan(d.sesi); location.hash = '#/'; rute();
    } catch (err) { layarMasuk(err.message); }
  });
}
$('#keluar').addEventListener('click', async (e) => { e.preventDefault(); await Umum.api('/api/keluar', { method: 'POST' }).catch(() => {}); Umum.kode.hapus(); layarMasuk(); });

// ---------------- ringkasan ----------------
function layarRingkas() {
  if (!acara) {
    layar.innerHTML = kepala('Selamat Datang') + `<div class="kartu" style="text-align:center;padding:30px 20px">
      <h2>Belum Ada Kegiatan</h2><p class="ket" style="margin:8px 0 18px">Mulai dengan membuat kegiatan. Halaman utama web langsung menjadi halaman absen kegiatan tersebut.</p>
      <a class="tombol emas" href="#/kegiatan-baru">+ Buat Kegiatan</a></div>`;
    return;
  }
  const sah = peserta.filter((p) => p.status !== 'dicabut').length;
  const ub = (r, i, t, k) => `<a href="#/${r}"><span class="bulat">${ikon(i)}</span><b>${t}</b><small>${k}</small></a>`;
  layar.innerHTML = `<div class="kepala"><h1>Ringkasan</h1><a class="tombol garis kecil" href="#/kegiatan-baru">+ Kegiatan Baru</a></div>
    <div class="aktif-kartu">
      <div class="label">KEGIATAN AKTIF DI HALAMAN ABSEN</div>
      <h2>${esc(acara.judul)}</h2>
      <div class="meta">${esc([acara.tanggal, acara.tempat].filter(Boolean).join(' · '))}</div>
      <div class="baris">
        <div class="angka">${sah}<small>sertifikat terbit</small></div>
        <button class="saklar ${acara.buka ? 'on' : ''}" id="saklar" type="button"><i></i>${acara.buka ? 'Absen dibuka' : 'Absen ditutup'}</button>
      </div>
    </div>
    <div class="ubin">
      ${ub('kegiatan', 'kegiatan', 'Data Kegiatan', 'Nama, tanggal, tempat')}
      ${ub('isian', 'isian', 'Isian Absen', (acara.isian || []).length ? (acara.isian || []).map((f) => f.label).join(', ') : 'Tambah nomor HP, jabatan, dll.')}
      ${ub('desain', 'desain', 'Desain', 'Pilih desain atau unggah dari Canva')}
      ${ub('ttd', 'ttd', 'Pengesahan', 'Pejabat dan kode QR')}
      ${ub('peserta', 'peserta', 'Peserta', sah + ' sertifikat, unduh PDF dan rekap')}
      ${ub('bagikan', 'bagikan', 'Bagikan Absen', 'QR dan tautan absen')}
      ${ub('email', 'email', 'Email', aturEmail && aturEmail.siap ? 'Aktif' : 'Belum diatur')}
    </div>
    <div class="tautan-kecil"><a href="/" target="_blank" rel="noopener">Halaman absen</a><a href="#/semua">Semua kegiatan</a><a href="#/sandi">Kata sandi</a><a href="#" id="keluar2">Keluar</a></div>`;
  $('#keluar2').onclick = (e) => { e.preventDefault(); $('#keluar').click(); };
  $('#saklar').addEventListener('click', async () => {
    try { await simpanAcara({ buka: !acara.buka }); Umum.toast(acara.buka ? 'Absen dibuka' : 'Absen ditutup'); layarRingkas(); }
    catch (e) { Umum.toast(e.message); }
  });
}

// ---------------- data kegiatan ----------------
function layarKegiatan(baru) {
  const d = new Date(Date.now() + 7 * 3600e3);
  const a = baru ? { judul: '', tanggal: '', tempat: '', tema: '', buka: true, peran: 'Peserta', formatNomor: '',
    kop1: 'KEMENTERIAN HUKUM REPUBLIK INDONESIA', kop2: 'KANTOR WILAYAH SUMATERA UTARA', penyelenggara: 'Kantor Wilayah Kementerian Hukum Sumatera Utara',
    pembuka: 'diberikan kepada', kalimat: 'atas partisipasinya sebagai {peran} dalam', desain: 'resmi', tampilQr: true, kirimEmail: true,
    penandatangan: (acara && acara.penandatangan) || [{ jabatan: 'Kepala Kantor Wilayah Kementerian Hukum Sumatera Utara', nama: '', nip: '' }],
    isian: (acara && acara.isian) || [], instansiMode: (acara && acara.instansiMode) || 'opsional', instansiPilihan: (acara && acara.instansiPilihan) || [] } : acara;
  const isian = (n, l, ph, w) => `<label class="isian"><span class="${w ? 'wajib' : ''}">${l}</span><input type="text" name="${n}" value="${esc(a[n] || '')}" placeholder="${esc(ph || '')}" maxlength="200"></label>`;
  layar.innerHTML = kepala(baru ? 'Kegiatan Baru' : 'Data Kegiatan') + `<form class="kartu" id="f">
    <div class="kolom">
      ${isian('judul', 'Nama kegiatan', 'Contoh: Sosialisasi Layanan Hukum', 1)}
      <div class="kolom dua">${isian('tanggal', 'Tanggal', 'Kamis, 10 Desember 2026', 1)}${isian('tempat', 'Tempat', 'Aula Kanwil Kemenkum Sumut')}</div>
      ${isian('tema', 'Tema (boleh kosong)', '')}
    </div>
    <details class="lain"><summary>Pengaturan lainnya (boleh dilewati)</summary><div class="kolom">
      <div class="kolom dua">

function siapkanLatar(berkas) {
  return new Promise((ok, gagal) => {
    const r = new FileReader(); r.onerror = gagal;
    r.onload = () => {
      const im = new Image(); im.onerror = gagal;
      im.onload = () => {
        const c = document.createElement('canvas'); c.width = 2339; c.height = 1654;
        const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
        const sk = Math.max(c.width / im.width, c.height / im.height), w = im.width * sk, h = im.height * sk;
        x.drawImage(im, (c.width - w) / 2, (c.height - h) / 2, w, h);
        let q = 0.86, data = c.toDataURL('image/jpeg', q);
        while (data.length > 1800000 && q > 0.5) { q -= 0.08; data = c.toDataURL('image/jpeg', q); }
        ok(data);
      };
      im.src = r.result;
    };
    r.readAsDataURL(berkas);
  });
}

// jumlah peserta per instansi; ejaan berbeda (huruf besar, spasi) dianggap sama
function rekapInstansi() {
  const grup = new Map();
  for (const p of peserta) {
    if (p.status === 'dicabut') continue;
    const asli = String(p.instansi || '').replace(/\s+/g, ' ').trim(), k = asli.toLowerCase().replace(/[.,]/g, '') || '~';
    if (!grup.has(k)) grup.set(k, { nama: asli || '(tanpa instansi)', jumlah: 0, ejaan: {} });
    const g = grup.get(k); g.jumlah++; g.ejaan[asli] = (g.ejaan[asli] || 0) + 1;

// ---------------- unduh banyak sertifikat ----------------
const TABEL_CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u) { let c = 0xFFFFFFFF; for (let i = 0; i < u.length; i++) c = TABEL_CRC[(c ^ u[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
// ZIP tanpa kompresi (PDF sudah terkompresi), nama berkas UTF-8
function buatZip(berkas) {
  const enc = new TextEncoder(), isi = [], pusat = [], d = new Date();
  const tgl = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate(), jam = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  let posisi = 0;
  for (const b of berkas) {
    const n = enc.encode(b.nama), c = crc32(b.data), uk = b.data.length;
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(10, jam, true); h.setUint16(12, tgl, true);
    h.setUint32(14, c, true); h.setUint32(18, uk, true); h.setUint32(22, uk, true); h.setUint16(26, n.length, true);
    isi.push(h.buffer, n, b.data);
    const p = new DataView(new ArrayBuffer(46));
    p.setUint32(0, 0x02014b50, true); p.setUint16(4, 20, true); p.setUint16(6, 20, true); p.setUint16(8, 0x0800, true); p.setUint16(12, jam, true); p.setUint16(14, tgl, true);
    p.setUint32(16, c, true); p.setUint32(20, uk, true); p.setUint32(24, uk, true); p.setUint16(28, n.length, true); p.setUint32(42, posisi, true);
    pusat.push(p.buffer, n);
    posisi += 30 + n.length + uk;
  }
  const ukPusat = pusat.reduce((a, x) => a + x.byteLength, 0), e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, berkas.length, true); e.setUint16(10, berkas.length, true); e.setUint32(12, ukPusat, true); e.setUint32(16, posisi, true);
  return new Blob([...isi, ...pusat, e.buffer], { type: 'application/zip' });
}
function proses(judul, i, n) {
  const el = $('#proses');
  if (judul === null) return el.classList.add('tersembunyi');
  el.classList.remove('tersembunyi');
  $('#prosesJudul').textContent = judul;
  $('#prosesKet').textContent = n ? `${i} dari ${n} sertifikat` : '';
  $('#prosesBar').style.width = n ? Math.round(i / n * 100) + '%' : '0';
}
function simpanBlob(blob, nama) {
  const l = document.createElement('a'); l.href = URL.createObjectURL(blob); l.download = nama; document.body.appendChild(l); l.click(); l.remove();
  setTimeout(() => URL.revokeObjectURL(l.href), 60000);
}
async function kirimBanyak(a, daftar) {
  daftar = daftar.filter((p) => p.status !== 'dicabut' && p.email).sort((x, y) => x.urut - y.urut);
  if (!daftar.length) return Umum.toast('Tidak ada peserta dengan email untuk dikirimi');
  if (!confirm(`Kirim sertifikat ke email ${daftar.length} peserta?`)) return;
  let ok = 0, gagal = 0;
  for (let i = 0; i < daftar.length; i++) {
    proses('Mengirim email', i, daftar.length);
    const p = daftar[i];
    try {
      const pdf = (await Sertifikat.pdf(a, p)).output('datauristring').split(',')[1];
      const d = await Umum.api(`/api/kirim/${a.id}/${p.kode}`, { method: 'POST', body: { pdf } });
      if (d.lewati) { proses(null); gambarPeserta(); return Umum.toast('Email belum diatur. Buka menu Email Otomatis.'); }
      p.email_status = 'terkirim'; ok++;
    } catch (err) { p.email_status = 'gagal'; gagal++; }
  }
  proses(null); gambarPeserta();
  Umum.toast(gagal ? `${ok} email terkirim, ${gagal} gagal` : `${ok} email terkirim`, 5000);
}
async function unduhBanyak(a, daftar) {
  daftar = daftar.filter((p) => p.status !== 'dicabut').sort((x, y) => x.urut - y.urut);
  if (!daftar.length) return Umum.toast('Belum ada sertifikat untuk diunduh');
  if (daftar.length === 1) { Umum.toast('Menyiapkan PDF...'); return Sertifikat.unduh(a, daftar[0]); }
  const dlg = $('#dialog'), f = $('#formDialog');
  f.innerHTML = `<h2 style="font-size:17px">Unduh ${daftar.length} Sertifikat</h2><p class="kecil" style="margin:4px 0 14px">${esc(a.judul)}</p>
    <div class="kolom">
      <button class="tombol emas lebar" value="zip">Berkas PDF per peserta (ZIP)</button>
      <button class="tombol garis lebar" value="gabung">Satu PDF berisi semua</button>
      <button class="tombol garis lebar" value="tutup">Batal</button>
    </div>`;
  dlg.onclose = async () => {
    const v = dlg.returnValue; dlg.onclose = null;
    if (v !== 'zip' && v !== 'gabung') return;
    const judul = bersihNama('Sertifikat ' + a.judul);
    try {
      if (v === 'gabung') {
        proses('Menyiapkan PDF', 0, daftar.length);
        const doc = await Sertifikat.pdfGabung(a, daftar, (i, n) => proses('Menyiapkan PDF', i, n));
        simpanBlob(doc.output('blob'), judul + '.pdf');
      } else {
        const berkas = [], dipakai = {};
        for (let i = 0; i < daftar.length; i++) {
          proses('Menyiapkan ZIP', i, daftar.length);
          const doc = await Sertifikat.pdf(a, daftar[i]);
          let nama = Sertifikat.namaBerkas(daftar[i].nama).replace(/\.pdf$/, '');
          const k = nama.toLowerCase(); dipakai[k] = (dipakai[k] || 0) + 1;
          if (dipakai[k] > 1) nama += ' (' + dipakai[k] + ')';
          berkas.push({ nama: String(daftar[i].urut).padStart(3, '0') + ' ' + nama + '.pdf', data: new Uint8Array(doc.output('arraybuffer')) });
        }
        proses('Menyiapkan ZIP', daftar.length, daftar.length);
        simpanBlob(buatZip(berkas), judul + '.zip');
      }
      Umum.toast('Unduhan siap');
    } catch (err) { Umum.toast('Gagal menyiapkan berkas: ' + err.message); }
    proses(null);
  };
  dlg.showModal();
}

    if (fd.get('baru') !== fd.get('ulang')) return Umum.toast('Kata sandi baru tidak sama');
    try { const d = await Umum.api('/api/sandi', { method: 'POST', body: { lama: fd.get('lama'), baru: fd.get('baru') } }); Umum.kode.simpan(d.sesi); Umum.toast('Kata sandi diganti'); location.hash = '#/'; }
    catch (err) { Umum.toast(err.message); }
  });
}

// ---------------- rute ----------------
let sudahMuat = false;
async function rute() {
  if (!Umum.kode.ambil()) return layarMasuk();
  const r = (location.hash.replace(/^#\/?/, '') || '');
  try {
    if (!sudahMuat) { await muatAktif(); aturEmail = (await Umum.api('/api/pengaturan')).pengaturan; sudahMuat = true; }
    $('#menu').classList.remove('tersembunyi'); $('#keluar').classList.remove('tersembunyi');
    gambarMenu(r);
    const perluAcara = ['kegiatan', 'isian', 'desain', 'ttd', 'peserta', 'bagikan'].includes(r);
    if (perluAcara && !acara) return layarRingkas();
    if (r === 'peserta') peserta = (await Umum.api('/api/peserta/' + acara.id)).peserta;
    ({ '': layarRingkas, kegiatan: () => layarKegiatan(false), isian: layarIsian, 'kegiatan-baru': () => layarKegiatan(true), desain: layarDesain, ttd: layarTtd, peserta: layarPeserta, bagikan: layarBagikan, email: layarEmail, semua: layarSemua, sandi: layarSandi }[r] || layarRingkas)();
    window.scrollTo(0, 0);
  } catch (e) {
    if (e.status === 401) { Umum.kode.hapus(); sudahMuat = false; return layarMasuk('Sesi berakhir, silakan masuk lagi.'); }
    layar.innerHTML = `<div class="kartu"><h2>Terjadi Gangguan</h2><p class="ket" style="margin-top:6px">${esc(e.message)}</p></div>`;
  }
}
window.addEventListener('hashchange', rute);
rute();
</script>
