<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Kelola E-Sertifikat | Kanwil Kemenkum Sumatera Utara</title>
<link rel="icon" href="/img/logo.png">
<link rel="stylesheet" href="/css/gaya.css">
<style>
  .judul-hal{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .judul-hal h1{font-family:Cinzel,serif;font-size:24px;color:var(--navy);letter-spacing:.02em}
  .grid-acara{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  .acara{display:flex;flex-direction:column;gap:10px}
  .acara h4{font-size:16.5px;font-weight:600;color:var(--navy);line-height:1.35}
  .acara .meta{font-size:13px;color:var(--redup)}
  .acara .bawah{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:8px}
  .angka{font-family:Cinzel,serif;font-weight:700;font-size:22px;color:var(--navy)}
  .tata-ubah{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:20px;align-items:start}
  .lengket{position:sticky;top:16px}
  @media (max-width:960px){.tata-ubah{grid-template-columns:1fr}.lengket{position:static}}
  .pilih-desain{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .pilih-desain label{border:2px solid var(--garis);border-radius:14px;padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;text-align:center}
  .pilih-desain input{display:none}
  .pilih-desain label:has(input:checked){border-color:var(--emas);box-shadow:0 0 0 3px rgba(201,161,59,.18)}
  .pilih-desain img{border-radius:8px;border:1px solid var(--garis);aspect-ratio:297/210;object-fit:cover;width:100%}
  .kotak-canva{display:flex;flex-direction:column;align-items:center;justify-content:center;aspect-ratio:297/210;border:1px dashed #CFC6B0;border-radius:8px;background:#FCFBF7;color:var(--redup);font-weight:500}
  .kotak-canva b{font-size:24px;color:var(--emas);line-height:1}
  .kotak-canva small{font-size:11px}
  .ttd-kotak{border:1px dashed #D3CBB8;border-radius:14px;padding:14px;background:#FCFBF7}
  .ttd-gambar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .ttd-gambar img{max-height:56px;background:repeating-conic-gradient(#f3f0e8 0 25%,#fff 0 50%) 0 0/14px 14px;border-radius:6px;padding:4px;border:1px solid var(--garis)}
  .bagikan{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}
  @media (max-width:720px){.bagikan{grid-template-columns:1fr}}
  .qr-kotak{background:#fff;border:1px solid var(--garis);border-radius:14px;padding:12px;text-align:center}
  .qr-kotak canvas{width:180px;height:180px;margin:0 auto}
  .alat{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .alat input{max-width:280px}
  .ringkas{display:flex;gap:26px;flex-wrap:wrap;margin-top:6px}
  .ringkas div{font-size:12.5px;color:var(--redup)}
</style>
</head>
<body>
<header class="kop"><div class="isi">
  <a href="/"><img src="/img/logo.png" alt="Logo Kementerian Hukum"></a>
  <div class="nama"><small>KEMENTERIAN HUKUM REPUBLIK INDONESIA</small><b>Kantor Wilayah Sumatera Utara</b></div>
  <nav><a href="#/" id="navBeranda">Daftar Acara</a><a href="#/email" id="navEmail" class="tersembunyi">Pengaturan Email</a><a href="#" id="keluar" class="tersembunyi">Keluar</a></nav>
</div></header>

<main><div class="wadah" id="layar"></div></main>

<dialog id="dialog"><form class="kartu" method="dialog" id="formDialog"></form></dialog>

<footer class="kaki"><b>Kantor Wilayah Kementerian Hukum Sumatera Utara</b><br>Pengelolaan Sertifikat Elektronik</footer>

<script src="/lib/qrcode.js"></script>
<script src="/lib/jspdf.umd.min.js"></script>
<script src="/js/umum.js"></script>
<script src="/js/sertifikat.js"></script>
<script>
const $ = (s, el) => (el || document).querySelector(s);
const layar = $('#layar');
const esc = Umum.esc;
const ROMAWI = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII'];

// ---------------- masuk ----------------
function layarMasuk(pesan) {
  $('#keluar').classList.add('tersembunyi');
  layar.innerHTML = `<div class="sempit" style="margin:20px auto">
    <form class="kartu" id="formMasuk">
      <div class="label" style="color:#9A7A2A">Khusus Pengelola</div>
      <h2 style="margin-top:6px">Masuk Pengelola</h2>
      <p class="ket" style="margin:6px 0 16px">Masukkan kode pengelola untuk membuat acara, membagikan daftar hadir, dan melihat peserta.</p>
      <div class="cari"><input type="password" id="kodeMasuk" placeholder="Kode pengelola" autocomplete="current-password" required><button class="tombol" type="submit">Masuk</button></div>
      ${pesan ? `<div class="pesan galat">${esc(pesan)}</div>` : ''}
    </form></div>`;
  $('#formMasuk').addEventListener('submit', async (e) => {
    e.preventDefault();
    Umum.kode.simpan($('#kodeMasuk').value.trim().toUpperCase());
    try { await Umum.api('/api/acara'); location.hash = '#/'; rute(); }
    catch (err) { Umum.kode.hapus(); layarMasuk(err.status === 401 ? 'Kode pengelola tidak sesuai.' : err.message); }
  });
}
$('#keluar').addEventListener('click', (e) => { e.preventDefault(); Umum.kode.hapus(); $('#navEmail').classList.add('tersembunyi'); layarMasuk(); });

// ---------------- daftar acara ----------------
async function layarDaftar() {
  layar.innerHTML = '<div class="judul-hal"><h1>Daftar Acara</h1><a class="tombol emas" href="#/baru">+ Buat Acara</a></div><div id="isiDaftar"><span class="memuat"></span></div>';
  const d = await Umum.api('/api/acara');
  const isi = $('#isiDaftar');
  if (!d.acara.length) {
    isi.innerHTML = `<div class="kartu" style="text-align:center;padding:40px 26px"><h2>Belum Ada Acara</h2><p class="ket" style="margin:8px 0 18px">Buat acara pertama, lalu bagikan tautan daftar hadirnya kepada peserta.</p><a class="tombol emas" href="#/baru">+ Buat Acara</a></div>`;
    return;
  }
  isi.innerHTML = '<div class="grid-acara">' + d.acara.map((a) => `
    <a class="kartu acara" href="#/acara/${a.id}" style="text-decoration:none">
      <span>${a.buka ? '<span class="chip ok">Daftar hadir dibuka</span>' : '<span class="chip tutup">Daftar hadir ditutup</span>'}</span>
      <h4>${esc(a.judul)}</h4>
      <div class="meta">${esc([a.tanggal, a.tempat].filter(Boolean).join(' · '))}</div>
      <div class="bawah"><div><div class="angka">${a.jumlah}</div><div class="meta">sertifikat terbit</div></div><span class="tombol garis kecil">Kelola</span></div>
    </a>`).join('') + '</div>';
}

// ---------------- formulir acara ----------------
const nilaiAwal = () => {
  const d = new Date(Date.now() + 7 * 3600e3);
  return {
    judul: '', tema: '', tanggal: '', tempat: '', penyelenggara: 'Kantor Wilayah Kementerian Hukum Sumatera Utara',
    desain: 'resmi', kop1: 'KEMENTERIAN HUKUM REPUBLIK INDONESIA', kop2: 'KANTOR WILAYAH SUMATERA UTARA', judulSertifikat: 'SERTIFIKAT',
    pembuka: 'diberikan kepada', kalimat: 'atas partisipasinya sebagai {peran} dalam', peran: 'Peserta',
    formatNomor: `{n}/SERT/KWSU/${ROMAWI[d.getUTCMonth()]}/${d.getUTCFullYear()}`, tempatTanggal: '', tampilQr: true, buka: true, mulai: '', sampai: '',
    penandatangan: [{ jabatan: 'Kepala Kantor Wilayah Kementerian Hukum Sumatera Utara', nama: '', nip: '' }],
    warnaTeks: '#1F2A5A', warnaAksen: '#B8923A', tampilKop: true, tampilJudul: true, kirimEmail: true, latarVersi: 0,
  };
};

function isian(nama, label, nilai, o = {}) {
  return `<label class="isian"><span class="${o.wajib ? 'wajib' : ''}">${label}</span><input type="${o.tipe || 'text'}" name="${nama}" value="${esc(nilai)}" ${o.ph ? `placeholder="${esc(o.ph)}"` : ''} maxlength="${o.maks || 160}">${o.ket ? `<small>${o.ket}</small>` : ''}</label>`;
}

function kotakTtd(p) {
  return `<div class="ttd-kotak">
    <div class="kolom">
      <label class="isian">Jabatan<input type="text" name="ttdJabatan" value="${esc(p.jabatan)}" maxlength="120" placeholder="Contoh: Kepala Kantor Wilayah Kementerian Hukum Sumatera Utara"></label>
      <div class="kolom dua">
        <label class="isian">Nama dan gelar<input type="text" name="ttdNama" value="${esc(p.nama)}" maxlength="90"></label>
        <label class="isian">NIP<input type="text" name="ttdNip" value="${esc(p.nip)}" maxlength="40" placeholder="Opsional"></label>
      </div>
      <small style="color:var(--redup);font-size:12.5px">Tanpa tanda tangan basah. Kode QR pada blok ini menjadi tanda pengesahan dan mengarah ke halaman cek keaslian.</small>
    </div></div>`;
}

async function layarUbah(id) {
  let a = nilaiAwal();
  if (id) { a = (await Umum.api('/api/acara/' + id)).acara; }
  let latarBaru = '';
  layar.innerHTML = `<div class="judul-hal"><h1>${id ? 'Ubah Acara' : 'Buat Acara Baru'}</h1><a class="tombol garis" href="${id ? '#/acara/' + id : '#/'}">Batal</a></div>
  <div class="tata-ubah">
    <form class="kartu" id="formAcara" novalidate>
      <h3>Informasi Kegiatan</h3>
      <div class="kolom">
        ${isian('judul', 'Nama kegiatan', a.judul, { wajib: 1, ph: 'Contoh: Sosialisasi Layanan Administrasi Hukum Umum' })}
        ${isian('tema', 'Tema atau subjudul', a.tema, { ph: 'Opsional', maks: 200 })}
        <div class="kolom dua">
          ${isian('tanggal', 'Tanggal kegiatan', a.tanggal, { wajib: 1, ph: 'Kamis, 10 Desember 2026', maks: 80 })}
          ${isian('tempat', 'Tempat', a.tempat, { ph: 'Aula Kanwil Kemenkum Sumut', maks: 120 })}
        </div>
        ${isian('penyelenggara', 'Penyelenggara', a.penyelenggara, { ket: 'Tampil di halaman verifikasi sertifikat.', maks: 120 })}
      </div>

      <h3>Pengaturan Desain Sertifikat</h3>
      <div class="pilih-desain">
        <label><input type="radio" name="desain" value="resmi" ${!['gading', 'sendiri'].includes(a.desain) ? 'checked' : ''}><img src="/desain/resmi.jpg" alt="">Resmi Navy Emas</label>
        <label><input type="radio" name="desain" value="gading" ${a.desain === 'gading' ? 'checked' : ''}><img src="/desain/gading.jpg" alt="">Gading Lembut</label>
        <label><input type="radio" name="desain" value="sendiri" ${a.desain === 'sendiri' ? 'checked' : ''}><span class="kotak-canva">${a.desain === 'sendiri' && a.latarVersi ? `<img src="/api/latar/${id}?v=${a.latarVersi}" alt="">` : '<b>+</b><small>Canva atau desain lain</small>'}</span>Desain Sendiri</label>
      </div>
      <div class="ttd-kotak${a.desain === 'sendiri' ? '' : ' tersembunyi'}" id="panelSendiri" style="margin-top:12px">
        <b style="font-size:14px;color:var(--navy)">Desain sendiri (Canva, PowerPoint, dan lainnya)</b>
        <ol class="kecil" style="margin:8px 0 12px 18px;line-height:1.7">
          <li>Buat desain di Canva ukuran <b>A4 mendatar (297 x 210 mm)</b>. Template sertifikat Canva boleh dipakai.</li>
          <li>Hapus tulisan nama, nomor, dan nama kegiatan pada template. Biarkan bagian tengah dan bagian bawah kosong untuk nama, kode QR, dan keterangan.</li>
          <li>Unduh sebagai <b>PNG</b> atau <b>JPG</b>, lalu unggah di sini.</li>
        </ol>
        <div class="kolom">
          <div class="ttd-gambar"><label class="tombol garis kecil" style="cursor:pointer">Unggah gambar desain<input type="file" accept="image/png,image/jpeg,image/webp" id="unggahLatar" hidden></label><span class="kecil" id="infoLatar">${a.latarVersi ? 'Desain sudah diunggah.' : 'Belum ada gambar.'}</span></div>
          <div class="kolom dua">
            <label class="isian">Warna teks utama<input type="color" name="warnaTeks" value="${esc(a.warnaTeks || '#1F2A5A')}" style="height:44px;padding:4px"></label>
            <label class="isian">Warna aksen (garis, peran, nomor)<input type="color" name="warnaAksen" value="${esc(a.warnaAksen || '#B8923A')}" style="height:44px;padding:4px"></label>
          </div>
          <label class="centang"><input type="checkbox" name="tampilKop" ${a.tampilKop !== false ? 'checked' : ''}> <span>Tampilkan logo dan kop (matikan bila sudah ada di desain)</span></label>
          <label class="centang"><input type="checkbox" name="tampilJudul" ${a.tampilJudul !== false ? 'checked' : ''}> <span>Tampilkan tulisan judul sertifikat (matikan bila sudah ada di desain)</span></label>
        </div>
      </div>
      <div class="kolom" style="margin-top:14px">
        <div class="kolom dua">${isian('kop1', 'Kop baris 1', a.kop1, { maks: 80 })}${isian('kop2', 'Kop baris 2', a.kop2, { maks: 80 })}</div>
        <div class="kolom dua">
          ${isian('formatNomor', 'Format nomor sertifikat', a.formatNomor, { ket: '{n} otomatis menjadi 001, 002, dan seterusnya.', maks: 60 })}
          ${isian('peran', 'Peran bawaan', a.peran, { ket: 'Contoh: Peserta. Narasumber dan moderator dapat ditambahkan manual.', maks: 40 })}
        </div>
        <div class="kolom dua">
          ${isian('pembuka', 'Kalimat pembuka', a.pembuka, { maks: 80 })}
          ${isian('kalimat', 'Kalimat sebelum nama kegiatan', a.kalimat, { ket: '{peran} diganti otomatis dengan peran peserta.', maks: 120 })}
        </div>
        ${isian('tempatTanggal', 'Tempat dan tanggal tanda tangan', a.tempatTanggal, { ph: 'Medan, 10 Desember 2026', maks: 80 })}
        <label class="centang"><input type="checkbox" name="tampilQr" ${a.tampilQr !== false ? 'checked' : ''}> <span>Tampilkan kode QR verifikasi pada sertifikat</span></label>
      </div>

      <h3>Pengesahan</h3>
      ${kotakTtd((a.penandatangan || [])[0] || { jabatan: '', nama: '', nip: '' })}

      <h3>Daftar Hadir</h3>
      <div class="kolom">
        <label class="centang"><input type="checkbox" name="buka" ${a.buka !== false ? 'checked' : ''}> <span>Daftar hadir dibuka</span></label>
        <label class="centang"><input type="checkbox" name="kirimEmail" ${a.kirimEmail !== false ? 'checked' : ''}> <span>Kirim sertifikat ke email peserta secara otomatis (atur di menu Pengaturan Email)</span></label>
        <div class="kolom dua">
          <label class="isian">Mulai (WIB)<input type="datetime-local" name="mulai" value="${Umum.dariIso(a.mulai)}"><small>Kosongkan bila langsung dibuka.</small></label>
          <label class="isian">Sampai (WIB)<input type="datetime-local" name="sampai" value="${Umum.dariIso(a.sampai)}"><small>Kosongkan bila tanpa batas waktu.</small></label>
        </div>
      </div>
      <div id="galatAcara" class="pesan galat tersembunyi"></div>
      <button class="tombol emas lebar" type="submit" id="simpanAcara" style="margin-top:20px">Simpan Acara</button>
    </form>
    <div class="lengket">
      <div class="kartu">
        <h3>Pratinjau</h3>
        <div class="pratinjau"><canvas id="pratinjau"></canvas><span class="tanda">CONTOH</span></div>
        <div class="baris-tombol" style="margin-top:12px"><button type="button" class="tombol garis kecil" id="contohPdf">Unduh contoh PDF</button></div>
      </div>
    </div>
  </div>`;

  const f = $('#formAcara');
  const baca = () => {
    const fd = new FormData(f), o = {};
    for (const k of ['judul', 'tema', 'tanggal', 'tempat', 'penyelenggara', 'kop1', 'kop2', 'formatNomor', 'peran', 'pembuka', 'kalimat', 'tempatTanggal']) o[k] = (fd.get(k) || '').toString().trim();
    o.desain = fd.get('desain') || 'resmi';
    o.tampilQr = !!fd.get('tampilQr');
    o.buka = !!fd.get('buka');
    o.mulai = Umum.keIso(fd.get('mulai')); o.sampai = Umum.keIso(fd.get('sampai'));
    o.penandatangan = [{ jabatan: (fd.get('ttdJabatan') || '').trim(), nama: (fd.get('ttdNama') || '').trim(), nip: (fd.get('ttdNip') || '').trim() }].filter((p) => p.nama || p.jabatan);
    o.warnaTeks = fd.get('warnaTeks') || '#1F2A5A'; o.warnaAksen = fd.get('warnaAksen') || '#B8923A';
    o.tampilKop = !!fd.get('tampilKop'); o.tampilJudul = !!fd.get('tampilJudul'); o.kirimEmail = !!fd.get('kirimEmail');
    o.id = id || 'baru'; o.latarVersi = a.latarVersi || 0; if (latarBaru) o.latarData = latarBaru;
    if (o.desain === 'sendiri' && !latarBaru && !a.latarVersi) o.latarData = '/desain/resmi.jpg';
    return o;
  };
  const contohPeserta = () => ({ nama: 'Nama Peserta, S.H., M.H.', nomor: (f.formatNomor.value || '{n}').replace(/\{n\}/g, '001'), kode: '', peran: f.peran.value || 'Peserta' });
  let tunda;
  const segarkan = () => { clearTimeout(tunda); tunda = setTimeout(() => Sertifikat.gambar($('#pratinjau'), baca(), contohPeserta(), { skala: 1, contoh: true }).catch(() => {}), 200); };

  f.addEventListener('change', (e) => { if (e.target.name === 'desain') $('#panelSendiri').classList.toggle('tersembunyi', e.target.value !== 'sendiri'); });
  $('#unggahLatar').addEventListener('change', async (e) => {
    const berkas = e.target.files[0]; if (!berkas) return;
    try {
      latarBaru = await siapkanLatar(berkas);
      $('#infoLatar').textContent = 'Gambar siap: ' + berkas.name;
      f.querySelector('.kotak-canva').innerHTML = `<img src="${latarBaru}" alt="">`;
      segarkan();
    } catch (err) { Umum.toast('Gambar tidak dapat dibaca'); }
  });
  segarkan();
  f.addEventListener('input', segarkan);
  f.addEventListener('change', segarkan);
  $('#contohPdf').addEventListener('click', async () => {
    const doc = await Sertifikat.pdf(baca(), { ...contohPeserta(), kode: 'CONTOH0000' });
    doc.save('Contoh Sertifikat.pdf');
  });

  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    const o = baca();
    const g = $('#galatAcara');
    if (!o.judul || !o.tanggal) { g.textContent = 'Nama kegiatan dan tanggal kegiatan wajib diisi.'; g.classList.remove('tersembunyi'); return; }
    g.classList.add('tersembunyi');
    const t = $('#simpanAcara'); t.disabled = true; t.innerHTML = '<span class="memuat"></span> Menyimpan...';
    try {
      delete o.latarData;
      const d = id ? await Umum.api('/api/acara/' + id, { method: 'PUT', body: o }) : await Umum.api('/api/acara', { method: 'POST', body: o });
      if (latarBaru) await Umum.api('/api/latar/' + d.id, { method: 'PUT', body: { data: latarBaru } });
      Umum.toast('Acara tersimpan');
      location.hash = '#/acara/' + d.id;
    } catch (err) { g.textContent = err.message; g.classList.remove('tersembunyi'); t.disabled = false; t.textContent = 'Simpan Acara'; }
  });
}

// gambar desain sendiri disesuaikan ke A4 mendatar (2339 x 1654 px) dan dikompres
function siapkanLatar(berkas) {
  return new Promise((ok, gagal) => {
    const r = new FileReader();
    r.onerror = gagal;
    r.onload = () => {
      const im = new Image();
      im.onerror = gagal;
      im.onload = () => {
        const c = document.createElement('canvas'); c.width = 2339; c.height = 1654;
        const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
        const sk = Math.max(c.width / im.width, c.height / im.height), w = im.width * sk, h = im.height * sk;
        x.drawImage(im, (c.width - w) / 2, (c.height - h) / 2, w, h);
        let q = 0.86, data = c.toDataURL('image/jpeg', q);
        while (data.length > 1800000 && q > 0.5) { q -= 0.08; data = c.toDataURL('image/jpeg', q); }
        ok(data);
      };
      im.src = r.result;
    };
    r.readAsDataURL(berkas);
  });
}

// ---------------- detail acara ----------------
let dataAcara = null, dataPeserta = [];
async function layarAcara(id) {
  layar.innerHTML = '<span class="memuat"></span>';
  const [a, p] = await Promise.all([Umum.api('/api/acara/' + id), Umum.api('/api/peserta/' + id)]);
  dataAcara = a.acara; dataPeserta = p.peserta;
  const tautan = location.origin + '/hadir/' + id;
  layar.innerHTML = `
    <div class="judul-hal">
      <div><a href="#/" class="kecil">&larr; Daftar acara</a><h1 style="margin-top:4px">${esc(dataAcara.judul)}</h1>
        <div class="ringkas"><div>${esc([dataAcara.tanggal, dataAcara.tempat].filter(Boolean).join(' · '))}</div></div></div>
      <div class="baris-tombol"><a class="tombol garis" href="#/ubah/${id}">Ubah Pengaturan</a><button class="tombol ${dataAcara.buka ? 'bahaya' : 'emas'}" id="bukaTutup">${dataAcara.buka ? 'Tutup Daftar Hadir' : 'Buka Daftar Hadir'}</button></div>
    </div>
    <div class="kartu">
      <div class="bagikan">
        <div>
          <h2>Bagikan Daftar Hadir</h2>
          <p class="ket" style="margin:6px 0 14px">Bagikan tautan atau kode QR ini kepada peserta. Peserta mengisi daftar hadir lalu langsung mengunduh sertifikat.</p>
          <div class="cari"><input type="text" value="${esc(tautan)}" readonly style="text-transform:none;letter-spacing:0;font-weight:500"><button class="tombol" type="button" id="salinTautan">Salin</button></div>
          <div class="baris-tombol" style="margin-top:12px"><a class="tombol garis kecil" href="${esc(tautan)}" target="_blank" rel="noopener">Buka halaman daftar hadir</a></div>
          <div style="margin-top:14px">${dataAcara.buka ? '<span class="chip ok">Daftar hadir sedang dibuka</span>' : '<span class="chip tutup">Daftar hadir ditutup</span>'}
            ${dataAcara.mulai ? `<span class="chip biru">Mulai ${esc(Umum.waktuJam(dataAcara.mulai))}</span>` : ''}
            ${dataAcara.sampai ? `<span class="chip biru">Sampai ${esc(Umum.waktuJam(dataAcara.sampai))}</span>` : ''}</div>
        </div>
        <div class="qr-kotak"><canvas id="qrHadir" width="540" height="540"></canvas><button class="tombol garis kecil" id="unduhQr" style="margin-top:10px">Unduh QR</button></div>
      </div>
    </div>
    <div class="kartu">
      <div class="judul-hal" style="margin-bottom:12px"><div><h2>Sertifikat Terbit</h2><div class="kecil" id="ringkasPeserta"></div></div>
        <div class="baris-tombol"><button class="tombol garis kecil" id="tambahManual">+ Tambah Manual</button><button class="tombol garis kecil" id="unduhCsv">Unduh Rekap (CSV)</button></div></div>
      <div class="alat"><input type="search" id="cariPeserta" placeholder="Cari nama, email, atau nomor"></div>
      <div class="tabel-wadah"><table><thead><tr><th>No</th><th>Nama</th><th>Instansi</th><th>Peran</th><th>Nomor</th><th>Waktu</th><th>Email</th><th>Aksi</th></tr></thead><tbody id="tbPeserta"></tbody></table></div>
    </div>`;

  // QR daftar hadir
  const q = qrcode(0, 'M'); q.addData(tautan); q.make();
  const cv = $('#qrHadir'), ctx = cv.getContext('2d'), n = q.getModuleCount(), pad = 30, s = (540 - pad * 2) / n;
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, 540, 540); ctx.fillStyle = '#1F2A5A';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) ctx.fillRect(pad + c * s, pad + r * s, s + 0.3, s + 0.3);
  $('#unduhQr').addEventListener('click', () => { const l = document.createElement('a'); l.download = 'QR Daftar Hadir ' + dataAcara.judul.replace(/[\\/:*?"<>|]+/g, ' ') + '.png'; l.href = cv.toDataURL('image/png'); l.click(); });
  $('#salinTautan').addEventListener('click', () => Umum.salin(tautan));
  $('#bukaTutup').addEventListener('click', async () => {
    try { await Umum.api('/api/acara/' + id, { method: 'PUT', body: { ...dataAcara, buka: !dataAcara.buka } }); Umum.toast(dataAcara.buka ? 'Daftar hadir ditutup' : 'Daftar hadir dibuka'); layarAcara(id); }
    catch (e) { Umum.toast(e.message); }
  });
  $('#cariPeserta').addEventListener('input', gambarTabel);
  $('#unduhCsv').addEventListener('click', unduhCsv);
  $('#tambahManual').addEventListener('click', () => bukaDialog(null));
  $('#tbPeserta').addEventListener('click', aksiTabel);
  gambarTabel();
}

function gambarTabel() {
  const kata = ($('#cariPeserta').value || '').toLowerCase();
  const daftar = dataPeserta.filter((p) => !kata || [p.nama, p.email, p.nomor, p.instansi].join(' ').toLowerCase().includes(kata));
  const sah = dataPeserta.filter((p) => p.status !== 'dicabut').length;
  $('#ringkasPeserta').textContent = `${sah} sertifikat sah${dataPeserta.length > sah ? ', ' + (dataPeserta.length - sah) + ' dibatalkan' : ''}`;
  $('#tbPeserta').innerHTML = daftar.length ? daftar.map((p) => `
    <tr class="${p.status === 'dicabut' ? 'dicabut' : ''}" data-pk="${esc(p.pk)}">
      <td>${p.urut}</td>
      <td><b style="font-weight:600">${esc(p.nama)}</b><div class="kecil">${esc(p.email || '')}</div></td>
      <td>${esc(p.instansi || '')}</td><td>${esc(p.peran || '')}</td><td style="white-space:nowrap">${esc(p.nomor)}</td>
      <td class="kecil" style="white-space:nowrap">${esc(Umum.waktuJam(p.waktu))}</td>
      <td>${!p.email ? '<span class="kecil">Tanpa email</span>' : p.email_status === 'terkirim' ? '<span class="chip ok">Terkirim</span>' : p.email_status === 'gagal' ? '<span class="chip merah">Gagal</span>' : p.email_status === 'dikirim' ? '<span class="chip biru">Diproses</span>' : '<span class="chip tutup">Belum</span>'}</td>
      <td class="aksi"><div class="baris-tombol" style="gap:6px">
        <button class="tombol garis kecil" data-aksi="unduh" ${p.status === 'dicabut' ? 'disabled' : ''}>PDF</button>
        <button class="tombol garis kecil" data-aksi="email" ${p.status === 'dicabut' || !p.email ? 'disabled' : ''}>Kirim Email</button>
        <button class="tombol garis kecil" data-aksi="ubah">Ubah</button>
        <button class="tombol ${p.status === 'dicabut' ? 'garis' : 'bahaya'} kecil" data-aksi="status">${p.status === 'dicabut' ? 'Pulihkan' : 'Batalkan'}</button>
      </div></td></tr>`).join('') : `<tr><td colspan="8" style="text-align:center;color:var(--redup);padding:28px">${dataPeserta.length ? 'Tidak ada yang cocok dengan pencarian.' : 'Belum ada sertifikat terbit. Bagikan tautan daftar hadir kepada peserta.'}</td></tr>`;
}

async function aksiTabel(e) {
  const b = e.target.closest('[data-aksi]'); if (!b) return;
  const pk = b.closest('tr').dataset.pk, p = dataPeserta.find((x) => x.pk === pk);
  if (b.dataset.aksi === 'unduh') { b.disabled = true; try { await Sertifikat.unduh(dataAcara, p); } finally { b.disabled = false; } }
  if (b.dataset.aksi === 'email') {
    b.disabled = true; b.innerHTML = '<span class="memuat"></span>';
    try {
      const doc = await Sertifikat.pdf(dataAcara, p);
      const pdf = doc.output('datauristring').split(',')[1];
      const d = await Umum.api(`/api/kirim/${dataAcara.id}/${p.kode}`, { method: 'POST', body: { pdf } });
      if (d.lewati) Umum.toast('Pengiriman email belum diatur. Buka menu Pengaturan Email.'); else { p.email_status = 'terkirim'; Umum.toast('Email terkirim ke ' + p.email); }
    } catch (err) { p.email_status = 'gagal'; Umum.toast(err.message); }
    gambarTabel();
  }
  if (b.dataset.aksi === 'ubah') bukaDialog(p);
  if (b.dataset.aksi === 'status') {
    const baru = p.status === 'dicabut' ? 'sah' : 'dicabut';
    if (baru === 'dicabut' && !confirm('Batalkan sertifikat atas nama ' + p.nama + '? Halaman verifikasi akan menampilkan status dibatalkan.')) return;
    try { const d = await Umum.api(`/api/peserta/${dataAcara.id}/${pk}`, { method: 'PATCH', body: { status: baru } }); Object.assign(p, d.peserta); gambarTabel(); Umum.toast(baru === 'sah' ? 'Sertifikat dipulihkan' : 'Sertifikat dibatalkan'); }
    catch (err) { Umum.toast(err.message); }
  }
}

function bukaDialog(p) {
  const dlg = $('#dialog'), f = $('#formDialog');
  f.innerHTML = `<h2>${p ? 'Ubah Data Sertifikat' : 'Tambah Sertifikat Manual'}</h2>
    <p class="ket" style="margin:4px 0 16px">${p ? 'Perubahan langsung berlaku pada halaman verifikasi dan saat sertifikat diunduh ulang.' : 'Untuk narasumber, moderator, panitia, atau peserta yang tidak sempat mengisi daftar hadir.'}</p>
    <div class="kolom">
      <label class="isian"><span class="wajib">Nama lengkap dan gelar</span><input type="text" name="nama" value="${esc(p ? p.nama : '')}" maxlength="120" required></label>
      ${p ? '' : '<label class="isian">Email<input type="email" name="email" maxlength="120" placeholder="Opsional"></label>'}
      <div class="kolom dua">
        <label class="isian">Peran<input type="text" name="peran" value="${esc(p ? p.peran : 'Narasumber')}" maxlength="40" list="daftarPeran"></label>
        <label class="isian">Instansi<input type="text" name="instansi" value="${esc(p ? p.instansi || '' : '')}" maxlength="120"></label>
      </div>
      <datalist id="daftarPeran"><option>Peserta</option><option>Narasumber</option><option>Moderator</option><option>Pembawa Acara</option><option>Panitia</option></datalist>
    </div>
    <div id="galatDialog" class="pesan galat tersembunyi"></div>
    <div class="baris-tombol" style="margin-top:18px;justify-content:flex-end"><button class="tombol garis" value="batal" formnovalidate>Batal</button><button class="tombol emas" value="simpan" id="simpanDialog">Simpan</button></div>`;
  dlg.showModal();
  $('#simpanDialog').onclick = async (e) => {
    e.preventDefault();
    const fd = new FormData(f), body = { nama: (fd.get('nama') || '').trim(), peran: (fd.get('peran') || '').trim(), instansi: (fd.get('instansi') || '').trim() };
    if (!p) body.email = (fd.get('email') || '').trim();
    try {
      if (p) { const d = await Umum.api(`/api/peserta/${dataAcara.id}/${p.pk}`, { method: 'PATCH', body }); Object.assign(p, d.peserta); }
      else { const d = await Umum.api(`/api/peserta/${dataAcara.id}`, { method: 'POST', body }); if (!dataPeserta.find((x) => x.pk === d.peserta.pk)) dataPeserta.push(d.peserta); }
      dlg.close(); gambarTabel(); Umum.toast('Tersimpan');
    } catch (err) { const g = $('#galatDialog'); g.textContent = err.message; g.classList.remove('tersembunyi'); }
  };
}

function unduhCsv() {
  const kolom = ['No', 'Nama', 'Email', 'Instansi', 'Peran', 'Nomor', 'Kode Verifikasi', 'Status', 'Waktu (WIB)', 'Status Email'];
  const sel = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const baris = dataPeserta.map((p) => [p.urut, p.nama, p.email, p.instansi, p.peran, p.nomor, p.kode, p.status === 'dicabut' ? 'Dibatalkan' : 'Sah', Umum.waktuJam(p.waktu), p.email_status || ''].map(sel).join(','));
  const blob = new Blob(['﻿' + [kolom.map(sel).join(','), ...baris].join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const l = document.createElement('a'); l.href = URL.createObjectURL(blob); l.download = 'Rekap Sertifikat ' + dataAcara.judul.replace(/[\\/:*?"<>|]+/g, ' ') + '.csv'; l.click();
}

// ---------------- pengaturan email ----------------
async function layarEmail() {
  const d = (await Umum.api('/api/pengaturan')).pengaturan;
  layar.innerHTML = `<div class="judul-hal"><h1>Pengaturan Email</h1>${d.siap ? '<span class="chip ok">Email otomatis aktif</span>' : '<span class="chip tutup">Belum aktif</span>'}</div>
  <div class="tata-ubah">
    <div class="kartu">
      <h3>Hubungkan Gmail Pengirim (sekali saja)</h3>
      <ol class="ket" style="margin-left:18px;line-height:1.75">
        <li>Klik <b>Salin Kode</b> di bawah ini.</li>
        <li>Buka <a href="https://script.google.com/home/projects/create" target="_blank" rel="noopener"><b>script.google.com</b></a> dengan Gmail yang akan menjadi pengirim. Proyek baru langsung terbuka.</li>
        <li>Hapus isi editor, tempel kode, lalu klik ikon <b>Simpan</b>.</li>
        <li>Klik <b>Terapkan</b>, <b>Deployment baru</b>, pilih jenis <b>Aplikasi web</b>. Atur <b>Jalankan sebagai: Saya</b> dan <b>Yang memiliki akses: Siapa saja</b>, lalu klik <b>Terapkan</b>.</li>
        <li>Klik <b>Berikan akses</b>, pilih akun Gmail, klik <b>Lanjutan</b>, <b>Buka (tidak aman)</b>, lalu <b>Izinkan</b>. Peringatan ini wajar untuk skrip buatan sendiri.</li>
        <li>Salin <b>URL Aplikasi web</b> yang muncul, tempel di kolom kanan, lalu klik <b>Simpan</b>.</li>
      </ol>
      <button class="tombol emas" type="button" id="salinKode" style="margin-top:12px">Salin Kode</button>
      <p class="kecil" style="margin-top:12px">Gmail biasa dapat mengirim sekitar 100 email per hari. Sertifikat tetap dapat diunduh langsung oleh peserta walaupun kuota habis.</p>
    </div>
    <form class="kartu" id="formEmail">
      <h3>Isian Email</h3>
      <div class="kolom">
        <label class="isian"><span class="wajib">URL Aplikasi web Apps Script</span><input type="text" name="mailerUrl" value="${esc(d.mailerUrl)}" placeholder="https://script.google.com/macros/s/.../exec"></label>
        <label class="isian">Nama pengirim<input type="text" name="namaPengirim" value="${esc(d.namaPengirim)}" placeholder="Kantor Wilayah Kementerian Hukum Sumatera Utara" maxlength="100"></label>
        <label class="isian">Subjek email<input type="text" name="subjek" value="${esc(d.subjek)}" maxlength="150"></label>
        <label class="isian">Isi email<textarea name="isi" rows="8" maxlength="3000">${esc(d.isi)}</textarea><small>Boleh memakai {nama}, {acara}, {nomor}, {tautan}, dan {pengirim}.</small></label>
      </div>
      <div id="galatEmail" class="pesan galat tersembunyi"></div>
      <button class="tombol emas lebar" type="submit" style="margin-top:16px">Simpan</button>
      <h3 style="margin-top:22px">Uji Pengiriman</h3>
      <div class="cari"><input type="email" id="emailUji" placeholder="Email tujuan uji" style="text-transform:none;letter-spacing:0;font-weight:500"><button class="tombol garis" type="button" id="kirimUji">Kirim Uji</button></div>
    </form>
  </div>`;
  $('#salinKode').addEventListener('click', async () => { const t = await (await fetch('/pengirim-email.txt')).text(); Umum.salin(t); Umum.toast('Kode disalin'); });
  $('#formEmail').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target), body = {};
    for (const k of ['mailerUrl', 'namaPengirim', 'subjek', 'isi']) body[k] = (fd.get(k) || '').toString();
    try { await Umum.api('/api/pengaturan', { method: 'PUT', body }); Umum.toast('Pengaturan email tersimpan'); layarEmail(); }
    catch (err) { const g = $('#galatEmail'); g.textContent = err.message; g.classList.remove('tersembunyi'); }
  });
  $('#kirimUji').addEventListener('click', async () => {
    const t = $('#kirimUji'); t.disabled = true; t.innerHTML = '<span class="memuat"></span>';
    try { await Umum.api('/api/pengaturan/uji', { method: 'POST', body: { email: $('#emailUji').value.trim() } }); Umum.toast('Email uji terkirim. Periksa kotak masuk.'); }
    catch (err) { Umum.toast(err.message); }
    t.disabled = false; t.textContent = 'Kirim Uji';
  });
}

// ---------------- rute ----------------
async function rute() {
  if (!Umum.kode.ambil()) return layarMasuk();
  $('#keluar').classList.remove('tersembunyi'); $('#navEmail').classList.remove('tersembunyi');
  const h = location.hash.replace(/^#/, '') || '/';
  try {
    let m;
    if (h === '/') await layarDaftar();
    else if (h === '/email') await layarEmail();
    else if (h === '/baru') await layarUbah(null);
    else if ((m = h.match(/^\/ubah\/([A-Za-z0-9]+)$/))) await layarUbah(m[1]);
    else if ((m = h.match(/^\/acara\/([A-Za-z0-9]+)$/))) await layarAcara(m[1]);
    else { location.hash = '#/'; }
    window.scrollTo(0, 0);
  } catch (e) {
    if (e.status === 401) { Umum.kode.hapus(); return layarMasuk('Kode pengelola tidak sesuai.'); }
    layar.innerHTML = `<div class="kartu"><h2>Terjadi Gangguan</h2><p class="ket" style="margin-top:6px">${esc(e.message)}</p><a class="tombol garis" href="#/" style="margin-top:14px">Kembali</a></div>`;
  }
}
window.addEventListener('hashchange', rute);
rute();
</script>
</body>
</html>
