<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BHP · Pasti Selalu Ada Solusinya!</title>
<meta name="description" content="Animasi kartun pendek gaya TikTok/Reels: Tasya dan Dinda ngobrol soal layanan Balai Harta Peninggalan.">
<meta name="theme-color" content="#0B2A5B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0B2A5B;
    --navy-deep: #06152E;
    --navy-soft: #16407F;
    --gold: #F2B705;
    --gold-deep: #B98A00;
    --paper: #F7F5F0;
    --ink: #0F172A;
    --ink-soft: #475569;
    --grey-bubble: #E4E7EC;
    --font: "Plus Jakarta Sans", "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--navy-deep); font-family: var(--font); color: var(--ink); overflow: hidden; -webkit-font-smoothing: antialiased; }

  /* ====== Kanvas 1080x1920, diskalakan agar muat layar ====== */
  #stage {
    position: absolute; left: 50%; top: 50%;
    width: 1080px; height: 1920px;
    transform-origin: 50% 50%;
    transform: translate(-50%, -50%) scale(var(--s, .4));
    overflow: hidden; background: var(--paper);
    box-shadow: 0 30px 120px rgba(0,0,0,.5);
  }
  #app { position: absolute; inset: 0; overflow: hidden; background: var(--paper); }

  /* ====== Latar & properti ====== */
  #bg, #bg svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #world { position: absolute; inset: 0; transform-origin: 50% 60%; transition: transform 7s linear; }
  #world.zoom { transform: scale(1.07); }
  .swing { transform-box: fill-box; transform-origin: 50% 0; animation: swing 4s ease-in-out infinite; }
  .swing.b { animation-duration: 4.6s; animation-direction: reverse; }
  @keyframes swing { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  .drift { animation: drift 26s linear infinite; }
  .drift.b { animation-duration: 38s; animation-delay: -12s; }
  @keyframes drift { from { transform: translateX(-300px); } to { transform: translateX(1200px); } }
  .spin { transform-box: fill-box; transform-origin: center; animation: spin 30s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .twinkle { animation: twinkle 1.6s ease-in-out infinite; }
  .twinkle:nth-child(2n) { animation-delay: .5s; } .twinkle:nth-child(3n) { animation-delay: 1s; }
  @keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

  #table { position: absolute; left: 0; right: 0; top: 1435px; bottom: 0; z-index: 3; }
  #table svg, #props svg { width: 100%; height: 100%; display: block; }
  #props { position: absolute; left: 0; right: 0; top: 1275px; height: 180px; z-index: 3; }
  .steam { animation: steam 2.4s ease-in infinite; }
  .steam.b { animation-delay: 1.2s; }
  @keyframes steam { 0% { transform: translateY(10px); opacity: 0; } 30% { opacity: .8; } 100% { transform: translateY(-40px); opacity: 0; } }

  /* ====== Progress & chip ====== */
  #progress { position: absolute; top: 36px; left: 40px; right: 40px; height: 10px; display: flex; gap: 10px; z-index: 5; }
  #progress i { flex: 1; background: rgba(255,255,255,.55); box-shadow: 0 0 0 1px rgba(11,42,91,.12); border-radius: 10px; overflow: hidden; position: relative; }
  #progress i b { position: absolute; inset: 0; width: 0%; background: var(--navy); border-radius: 10px; }
  #chip {
    position: absolute; top: 76px; left: 40px; height: 80px; z-index: 5;
    display: flex; align-items: center; gap: 18px;
    padding: 0 34px 0 12px; border-radius: 80px;
    background: #fff; box-shadow: 0 8px 24px rgba(11,42,91,.18);
    font-weight: 800; font-size: 34px; color: var(--navy);
  }
  #chip .ico { width: 58px; height: 58px; border-radius: 50%; background: var(--navy); display: grid; place-items: center; }
  #chip .ico svg { width: 34px; height: 34px; stroke: var(--gold); }
  #chip small { font-weight: 600; color: var(--ink-soft); font-size: 28px; }
  #brand {
    position: absolute; top: 90px; right: 40px; height: 52px; padding: 0 22px; z-index: 5;
    display: flex; align-items: center; border-radius: 50px;
    background: var(--gold); color: var(--navy); font-weight: 800; font-size: 26px; letter-spacing: .08em;
    box-shadow: 0 8px 24px rgba(11,42,91,.18);
  }

  /* ====== Tokoh kartun ====== */
  .char { position: absolute; top: 880px; width: 520px; height: 756px; z-index: 2; }
  .char.tasya { left: 20px; }
  .char.dinda { right: 20px; }
  .char > svg { width: 100%; height: 100%; overflow: visible; transform-origin: 50% 100%; animation: breathe 3.2s ease-in-out infinite; }
  .char.dinda > svg { animation-delay: -1.4s; }
  @keyframes breathe { 0%, 100% { transform: none; } 50% { transform: scaleY(1.015) translateY(-3px); } }
  .tilt, .head, .eyes, .brows, .arm { transform-box: fill-box; }
  .tilt { transform-origin: 50% 100%; transition: transform .45s cubic-bezier(.2,1.3,.4,1); }
  .head { transform-origin: 50% 90%; }
  .eyes { transform-origin: center; animation: blink 4.2s infinite; }
  .dinda .eyes { animation-delay: -2s; }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
  .brows { transition: transform .3s; }
  .m-open { opacity: 0; }
  .arm { transform-origin: 50% 100%; transform: translateY(330px) rotate(18deg); transition: transform .5s cubic-bezier(.2,1.3,.4,1); }
  .dinda .arm { transform: translateY(330px) rotate(-18deg); }

  /* Bicara: mulut buka-tutup + kepala mengangguk kecil */
  .char.talking .m-open { animation: yap .24s steps(1) infinite; }
  .char.talking .m-closed { animation: yap .24s steps(1) infinite reverse; }
  .char.talking .head { animation: bob .6s ease-in-out infinite; }
  @keyframes yap { 0% { opacity: 1; } 50% { opacity: 0; } }
  @keyframes bob { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(2deg) translateY(-3px); } }
  .char.thinking .tilt { transform: rotate(-5deg); }
  .dinda.thinking .tilt { transform: rotate(5deg); }

  /* Aksi / ekspresi (diatur lewat field "act" di data scene) */
  .act-shock { animation: jump .6s cubic-bezier(.3,1.6,.5,1); }
  .act-shock .eyes { animation: none; transform: scale(1.3); }
  .act-shock .brows, .act-wow .brows { transform: translateY(-14px); }
  .act-shock .arm, .act-explain .arm, .act-phone .arm, .act-wow .arm { transform: none; }
  .act-explain .arm { animation: wag .5s ease-in-out .5s 3; }
  @keyframes wag { 0%, 100% { transform: none; } 50% { transform: rotate(-10deg); } }
  .act-tilt .tilt { transform: rotate(-9deg); }
  .dinda.act-tilt .tilt { transform: rotate(9deg); }
  .act-sad .tilt { transform: rotate(5deg) translateY(10px); }
  .dinda.act-sad .tilt { transform: rotate(-5deg) translateY(10px); }
  .act-sad .brows { transform: rotate(6deg); }
  .act-nod .tilt { animation: nod .45s ease-in-out 3; }
  @keyframes nod { 0%, 100% { transform: none; } 50% { transform: translateY(10px) rotate(2deg); } }
  .act-bounce, .act-wow { animation: jump .55s cubic-bezier(.3,1.6,.5,1) 2; }
  @keyframes jump { 0%, 100% { transform: none; } 40% { transform: translateY(-50px); } }
  .act-laugh { animation: giggle .2s ease-in-out 8; }
  @keyframes giggle { 0%, 100% { transform: none; } 50% { transform: translateY(-10px) rotate(1deg); } }
  .char.act-laugh .eyes { animation: none; transform: scaleY(.25); }
  .char.act-laugh .m-open { opacity: 1; animation: none; }
  .char.act-laugh .m-closed { opacity: 0; animation: none; }
  .act-phone .tilt { transform: rotate(4deg); }

  .emote {
    position: absolute; top: 120px; font-size: 100px; line-height: 1; z-index: 3;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,.2));
    animation: emote .5s cubic-bezier(.2,1.6,.4,1) both, float 1.6s ease-in-out .5s infinite;
  }
  .tasya .emote { left: 410px; }
  .dinda .emote { left: 0; }
  @keyframes emote { from { transform: scale(0) rotate(-30deg); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes float { 0%, 100% { transform: none; } 50% { transform: translateY(-14px); } }

  /* ====== Balon bicara ====== */
  #talk {
    position: absolute; left: 40px; right: 40px; top: 190px; height: 800px; z-index: 4;
    display: flex; flex-direction: column; justify-content: flex-end; gap: 22px;
    padding-bottom: 34px; overflow: hidden;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 80px);
            mask-image: linear-gradient(to bottom, transparent 0, #000 80px);
  }
  .line { display: flex; flex: none; }
  .line.right { justify-content: flex-end; }
  .bubble {
    position: relative; max-width: 860px; padding: 22px 32px 24px;
    border-radius: 40px; font-size: 42px; line-height: 1.36; font-weight: 600;
    box-shadow: 0 10px 0 rgba(11,42,91,.10), 0 16px 30px rgba(15,23,42,.14);
    transform-origin: 25% 100%;
    animation: pop .42s cubic-bezier(.2,1.4,.4,1) backwards;
    transition: opacity .4s, transform .4s;
  }
  .left .bubble { background: var(--grey-bubble); color: var(--ink); border: 4px solid #fff; }
  .right .bubble { background: var(--navy); color: #fff; border: 4px solid #fff; transform-origin: 75% 100%; }
  .bubble::after {
    content: ""; position: absolute; bottom: -34px; width: 0; height: 0;
    border-left: 20px solid transparent; border-right: 20px solid transparent; border-top: 34px solid;
  }
  .left .bubble::after { left: 190px; border-top-color: var(--grey-bubble); transform: skewX(20deg); }
  .right .bubble::after { right: 190px; border-top-color: var(--navy); transform: skewX(-20deg); }
  .bubble.listcard { background: #fff; color: var(--navy); border: 5px solid var(--gold); padding: 26px 34px 30px; min-width: 760px; }
  .right .bubble.listcard::after { border-top-color: var(--gold); }
  .listcard .ltitle { font-size: 46px; font-weight: 800; margin: 4px 0 14px; }
  .listcard ul { list-style: none; display: grid; gap: 14px; }
  .listcard li { display: flex; align-items: center; gap: 20px; font-size: 38px; font-weight: 700; line-height: 1.25;
    background: #F4F6FA; border-left: 10px solid var(--navy); border-radius: 18px; padding: 14px 20px;
    opacity: 0; transform: translateX(40px); transition: opacity .3s, transform .45s cubic-bezier(.2,1.4,.4,1); }
  .listcard li.in { opacity: 1; transform: none; }
  .listcard li span { font-size: 48px; flex: none; }
  .line.old .bubble { opacity: .72; transform: scale(.92); }
  .line.old .bubble::after { display: none; }
  .bubble .name { font-size: 28px; font-weight: 800; margin-bottom: 4px; display: flex; align-items: center; gap: 12px; }
  .left .bubble .name { color: var(--gold-deep); }
  .right .bubble .name { color: var(--gold); }
  .bubble .tag { font-size: 20px; font-weight: 700; padding: 3px 12px; border-radius: 20px; letter-spacing: .04em; }
  .left .tag { background: rgba(185,138,0,.14); color: var(--gold-deep); }
  .right .tag { background: var(--gold); color: var(--navy); }
  .bubble.typing { padding: 30px 38px; display: flex; gap: 14px; }
  .bubble.typing i { width: 20px; height: 20px; border-radius: 50%; background: currentColor; opacity: .45; animation: dot 1s infinite ease-in-out; }
  .bubble.typing i:nth-child(2) { animation-delay: .15s; }
  .bubble.typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes dot { 0%, 60%, 100% { transform: translateY(0); opacity: .35; } 30% { transform: translateY(-14px); opacity: .9; } }
  @keyframes pop {
    0% { transform: scale(.5) translateY(30px); opacity: 0; }
    70% { transform: scale(1.04); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* ====== Overlay kartu putih bawah ====== */
  #overlay {
    position: absolute; left: 76px; right: 76px; bottom: 190px; z-index: 6;
    display: flex; align-items: center; gap: 32px;
    padding: 34px 40px 34px 34px; border-radius: 40px;
    background: #fff; color: var(--ink);
    border: 4px solid var(--navy);
    box-shadow: 0 30px 60px rgba(11,42,91,.28), 14px 14px 0 var(--gold);
    transform: translateX(-130%) rotate(-3deg); opacity: 0;
    transition: transform .6s cubic-bezier(.2,1.2,.35,1), opacity .3s;
  }
  #overlay.show { transform: none; opacity: 1; }
  #overlay .oico { width: 150px; height: 150px; border-radius: 32px; background: var(--navy); flex: none; display: grid; place-items: center; }
  #overlay .oico { position: relative; }
  #overlay .oico .oi { display: grid; place-items: center; }
  #overlay .oico svg { width: 88px; height: 88px; stroke: var(--gold); }
  #overlay .onum {
    position: absolute; top: -22px; left: -22px; width: 76px; height: 76px; border-radius: 50%;
    background: var(--gold); color: var(--navy); border: 5px solid #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 28px; box-shadow: 0 6px 14px rgba(0,0,0,.2);
  }
  #overlay .onum b { font-size: 38px; }
  #overlay .stamp {
    position: absolute; right: -6px; top: -48px; padding: 8px 20px; border-radius: 14px;
    background: #fff; color: #15803D; border: 6px solid #15803D;
    font-weight: 800; font-size: 32px; letter-spacing: .06em; white-space: nowrap;
    opacity: 0; transform: rotate(-8deg) scale(3);
  }
  #overlay.show .stamp { animation: stamp .45s cubic-bezier(.2,1.5,.4,1) .6s forwards; }
  @keyframes stamp { to { opacity: 1; transform: rotate(-8deg) scale(1); } }
  #overlay .kicker { font-size: 26px; font-weight: 800; letter-spacing: .12em; color: var(--gold-deep); text-transform: uppercase; }
  #overlay .otitle { font-size: 52px; line-height: 1.12; font-weight: 800; color: var(--navy); margin-top: 6px; }
  #overlay .osub { font-size: 40px; font-weight: 700; color: var(--ink); margin-top: 8px; }
  #overlay .osub:empty { display: none; }

  /* ====== Klimaks ====== */
  #vignette {
    position: absolute; inset: 0; z-index: 7; pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse 70% 55% at 50% 58%, rgba(6,21,46,.3) 0%, rgba(6,21,46,.8) 65%, rgba(0,0,0,.95) 100%);
    transition: opacity 1.8s ease;
  }
  #app.dim #vignette { opacity: 1; }
  #boss {
    position: absolute; left: 90px; right: 90px; bottom: 110px; z-index: 8;
    display: flex; flex-direction: column; align-items: center;
    transform: translateY(115%); opacity: 0;
    transition: transform 1.3s cubic-bezier(.16,1,.3,1), opacity .6s;
  }
  #boss.in { transform: none; opacity: 1; }
  #boss .fig {
    width: 560px; height: 520px; position: relative;
    border-radius: 50% 50% 32px 32px / 42% 42% 32px 32px;
    background: radial-gradient(circle at 50% 38%, rgba(242,183,5,.55), rgba(242,183,5,.08) 55%, transparent 70%);
    display: grid; place-items: end center;
  }
  #boss.in .fig { animation: slowzoom 9s linear forwards; }
  @keyframes slowzoom { from { transform: scale(1); } to { transform: scale(1.08); } }
  #boss .fig svg { width: 440px; height: 470px; }
  #boss .plate {
    margin-top: -24px; position: relative; z-index: 1;
    background: var(--gold); color: var(--navy); font-weight: 800; font-size: 36px;
    padding: 14px 40px; border-radius: 60px; letter-spacing: .03em;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  #boss .speech {
    margin-top: 28px; width: 100%; min-height: 250px;
    background: #fff; border-radius: 40px; padding: 36px 44px;
    font-size: 52px; line-height: 1.3; font-weight: 700; color: var(--ink);
    box-shadow: 0 30px 60px rgba(0,0,0,.4);
  }
  #boss .speech span { display: inline-block; opacity: 0; transform: translateY(18px); transition: opacity .25s, transform .3s cubic-bezier(.2,1.4,.4,1); margin-right: .26em; }
  #boss .speech span.in { opacity: 1; transform: none; }
  #boss .speech span.em { color: var(--navy); background: linear-gradient(transparent 62%, rgba(242,183,5,.55) 62%); }

  #tagline { position: absolute; left: 40px; right: 40px; top: 250px; z-index: 9; text-align: center; pointer-events: none; opacity: 0; }
  #tagline .rays {
    position: absolute; left: 50%; top: 50%; width: 1300px; height: 1300px; transform: translate(-50%,-50%) scale(.2); opacity: 0;
    background: repeating-conic-gradient(from 0deg, rgba(242,183,5,.28) 0 6deg, transparent 6deg 18deg);
    -webkit-mask-image: radial-gradient(circle, #000 12%, transparent 62%);
            mask-image: radial-gradient(circle, #000 12%, transparent 62%);
    transition: transform 1.2s cubic-bezier(.16,1,.3,1), opacity .6s;
  }
  #tagline .t1, #tagline .t2 { position: relative; display: block; font-weight: 800; line-height: 1; letter-spacing: -.02em; }
  #tagline .t1 { font-size: 108px; color: #fff; text-shadow: 0 8px 0 var(--navy), 0 20px 40px rgba(0,0,0,.6); }
  #tagline .t2 { font-size: 150px; color: var(--gold); margin-top: 14px; text-shadow: 0 10px 0 var(--navy), 0 24px 50px rgba(0,0,0,.6); }
  #tagline.show { opacity: 1; animation: tagpop .7s cubic-bezier(.2,1.5,.4,1) both; }
  #tagline.show .rays { transform: translate(-50%,-50%) scale(1); opacity: 1; }
  @keyframes tagpop { 0% { transform: scale(2.2); opacity: 0; } 60% { transform: scale(.93); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }

  #flash { position: absolute; inset: 0; z-index: 10; background: #fff; opacity: 0; pointer-events: none; }
  #flash.go { animation: flash .55s ease-out; }
  @keyframes flash { 0% { opacity: 0; } 15% { opacity: .95; } 100% { opacity: 0; } }
  #app.shake { animation: shake .5s cubic-bezier(.36,.07,.19,.97); }
  @keyframes shake {
    10%, 90% { transform: translate(-4px, 2px); }
    20%, 80% { transform: translate(8px, -4px); }
    30%, 50%, 70% { transform: translate(-14px, 6px) rotate(-.4deg); }
    40%, 60% { transform: translate(14px, -6px) rotate(.4deg); }
  }
  #app.resetting, #app.resetting * { transition: none !important; }
  /* Freeze frame: semua berhenti, warna dikeraskan, bingkai putih */
  #app.frozen, #app.frozen * { animation-play-state: paused !important; }
  #app.frozen { filter: contrast(1.12) saturate(.75); }
  #app.frozen::after { content: ""; position: absolute; inset: 0; z-index: 11; pointer-events: none; box-shadow: inset 0 0 0 18px #fff, inset 0 0 0 22px rgba(11,42,91,.6); }
  #freezetag { position: absolute; top: 60px; right: 60px; z-index: 12; display: none; background: #fff; color: var(--navy); font-weight: 800; font-size: 30px; padding: 10px 24px; border-radius: 12px; letter-spacing: .1em; }
  #app.frozen #freezetag { display: block; }

  /* ====== Wipe transisi ====== */
  #wipe {
    position: absolute; inset: 0; z-index: 30; pointer-events: none;
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-soft) 100%);
    transform: translateX(-104%); display: grid; place-items: center;
  }
  #wipe::before, #wipe::after { content: ""; position: absolute; top: 0; bottom: 0; width: 26px; background: var(--gold); }
  #wipe::before { left: 0; } #wipe::after { right: 0; }
  #wipe span { font-size: 64px; font-weight: 800; color: var(--gold); letter-spacing: .2em; }
  #wipe.cover  { transform: translateX(0);    transition: transform .45s cubic-bezier(.7,0,.3,1); }
  #wipe.reveal { transform: translateX(104%); transition: transform .45s cubic-bezier(.7,0,.3,1); }

  /* ====== Layar mulai & penutup ====== */
  .screen {
    position: absolute; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    padding: 120px 90px; color: #fff;
    background:
      radial-gradient(800px 700px at 50% 40%, rgba(242,183,5,.16), transparent 60%),
      repeating-linear-gradient(135deg, rgba(255,255,255,.025) 0 2px, transparent 2px 36px),
      linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
  }
  .screen[hidden] { display: none; }
  .emblem { width: 260px; height: 260px; border-radius: 50%; display: grid; place-items: center; border: 8px solid var(--gold); background: rgba(255,255,255,.05); box-shadow: 0 0 0 18px rgba(242,183,5,.12); }
  .emblem svg { width: 140px; height: 140px; stroke: var(--gold); }
  .duo { display: flex; gap: 10px; align-items: flex-end; height: 470px; border-bottom: 10px solid var(--gold); }
  .duo .char { position: relative; top: auto; left: auto; right: auto; width: 360px; height: 470px; }
  .duo .char > svg { height: 523px; }
  .duo .char { overflow: hidden; }
  #start h1 { margin-top: 60px; font-size: 92px; line-height: 1.05; font-weight: 800; letter-spacing: -.02em; }
  #start h1 em { font-style: normal; color: var(--gold); }
  #start p { margin-top: 26px; font-size: 38px; color: #BFD2F2; font-weight: 500; line-height: 1.4; }
  .btn {
    margin-top: 70px; display: inline-flex; align-items: center; gap: 24px;
    font: 800 52px/1 var(--font); color: var(--navy); background: var(--gold);
    border: 0; border-radius: 100px; padding: 36px 76px 36px 56px; cursor: pointer;
    box-shadow: 0 16px 0 var(--gold-deep), 0 30px 60px rgba(0,0,0,.4);
    transition: transform .15s, box-shadow .15s;
  }
  .btn:hover { transform: translateY(-4px); }
  .btn:active { transform: translateY(10px); box-shadow: 0 6px 0 var(--gold-deep), 0 16px 30px rgba(0,0,0,.4); }
  .btn:focus-visible { outline: 6px solid #fff; outline-offset: 10px; }
  .btn svg { width: 56px; height: 56px; fill: var(--navy); }
  .toggle {

function estimateScene(sc) {
  let d = T.wipe * 2 + T.wipeHold + T.sceneIntro;
  for (const m of sc.messages) d += typingDur(m) + holdDur(m);
  if (sc.overlay) d += T.overlayIn + T.overlayHold;
  if (sc.climax) d += T.silence + T.bossIn + sc.climax.text.split(/\s+/).length * T.wordGap + T.afterWords + T.taglineHold + T.freeze;
  return d;
}

const TTS = 'speechSynthesis' in window;
let soundOn = true, idVoice = null, currentAudio = null;
function pickVoice() {
  if (!TTS) return;
  const vs = speechSynthesis.getVoices().filter((v) => /^id(-|_|$)/i.test(v.lang));
  idVoice = vs.find((v) => /google/i.test(v.name)) || vs.find((v) => /natural|online/i.test(v.name)) || vs[0] || null;
  updateSoundUi();
}
const cleanSpeech = (t) => t.replace(/[\p{Extended_Pictographic}️‍]/gu, '').replace(/\s+/g, ' ').trim();
/* Membacakan teks; selesai saat suara berakhir (dengan batas waktu aman). */
function speak(text, who, audioSrc) {
  if (!soundOn) return Promise.resolve();
  Music.duck(true);
  return speakRaw(text, who, audioSrc).then(() => Music.duck(false));
}
function speakRaw(text, who, audioSrc) {
  if (audioSrc) {
    return new Promise((res) => {
      const a = new Audio(audioSrc); currentAudio = a;
      a.onended = a.onerror = () => res();
      a.play().catch(() => res());
    });
  }
  const t = cleanSpeech(text || '');
  if (!TTS || !t) return Promise.resolve();
  return new Promise((res) => {
    const u = new SpeechSynthesisUtterance(t);
    const v = VOICES[who] || VOICES.narator;
    u.lang = 'id-ID'; if (idVoice) u.voice = idVoice;
    u.pitch = v.pitch; u.rate = v.rate * Math.min(SPEED, 2);
    let done = false; const finish = () => { if (!done) { done = true; res(); } };
    u.onend = u.onerror = finish;
    setTimeout(finish, (t.length * 95) / u.rate + 2500); // jaga-jaga bila event "end" tak muncul
    speechSynthesis.speak(u);
  });
}
/* ===================== Backsound & SFX (Web Audio, tanpa file) =====================
   Beat lo-fi/trap 92 BPM: kick, clap, hi-hat roll, 808, pad chord, arpeggio, kresek vinyl.
   SFX meme: pop, whoosh, vine boom, ding, stempel, riser, drop, record scratch. */
let musicOn = true;
const Music = (() => {
  let ctx, master, bus, duckG, sfx, noiseBuf, timer = null, stopTimer = null, step = 0, next = 0;
  const BPM = 92, SPB = 60 / BPM / 4;
  const CHORDS = [[53, 57, 60, 64], [52, 55, 59, 62], [50, 53, 57, 60], [48, 52, 55, 59]]; // Fmaj7 Em7 Dm7 Cmaj7
  const ROOTS = [41, 40, 38, 36];
  const ARP = [0, 2, 1, 3, 2, 1, 3, 2];
  const hz = (m) => 440 * 2 ** ((m - 69) / 12);
  function init() {
    if (ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    ctx = new AC();
    const comp = ctx.createDynamicsCompressor(); comp.connect(ctx.destination);
    master = ctx.createGain(); master.gain.value = .9; master.connect(comp);
    bus = ctx.createGain(); bus.gain.value = 0;
    duckG = ctx.createGain(); bus.connect(duckG); duckG.connect(master);
    sfx = ctx.createGain(); sfx.gain.value = .7; sfx.connect(master);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return true;
  }
  function noise(t, dur, { type = 'highpass', freq = 7000, to, q = 1, gain = .2, dest = bus } = {}) {
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = type; f.Q.value = q;
    f.frequency.setValueAtTime(freq, t); if (to) f.frequency.exponentialRampToValueAtTime(to, t + dur);
    const g = ctx.createGain(); g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(dest); s.start(t); s.stop(t + dur + .05);
  }
  function tone(t, freq, dur, { type = 'sine', to, gain = .2, attack = .005, lp, dest = bus } = {}) {
    const o = ctx.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(freq, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    const g = ctx.createGain(); g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + attack); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    let n = o; if (lp) { const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp; o.connect(f); n = f; }
    n.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + .05);
  }
  function beat(s, t) {
    const bar = Math.floor(s / 16) % 4, i = s % 16, ch = CHORDS[bar];
    if (i === 0) ch.forEach((n) => { tone(t, hz(n), SPB * 16, { type: 'triangle', gain: .04, attack: .3, lp: 1300 }); tone(t, hz(n) * 1.005, SPB * 16, { gain: .03, attack: .35 }); });
    if (i === 0 || i === 6 || i === 10) tone(t, 150, .35, { to: 45, gain: .85 });                       // kick
    if (i === 4 || i === 12) { noise(t, .18, { type: 'bandpass', freq: 1500, q: .8, gain: .4 }); noise(t + .012, .12, { type: 'bandpass', freq: 1100, gain: .25 }); } // clap
    const roll = Math.floor(s / 16) % 2 === 1 && i >= 12;                                               // hi-hat roll
    if (roll) { noise(t, .04, { freq: 8000, gain: .09 }); noise(t + SPB / 2, .04, { freq: 8000, gain: .06 }); }
    else if (i % 2 === 0) noise(t, .045, { freq: 8000, gain: i % 4 === 0 ? .11 : .07 });
    if (i === 0) tone(t, hz(ROOTS[bar]), SPB * 6, { gain: .5, attack: .01 });                          // 808
    if (i === 10) tone(t, hz(ROOTS[bar]), SPB * 5, { gain: .45, attack: .01 });
    if (s >= 32 && i % 2 === 0) tone(t + (i % 4 === 2 ? SPB * .12 : 0), hz(ch[ARP[i / 2]] + 12), .28, { type: 'triangle', gain: .06, lp: 2800 }); // arpeggio
    if (Math.random() < .3) noise(t, .012, { freq: 3000, gain: .03 });                                 // kresek vinyl
  }
  function tick() { while (next < ctx.currentTime + .12) { beat(step, next); step++; next += SPB; } }
  const now = () => ctx.currentTime;
  const ok = () => musicOn && init();
  return {
    start(vol = .8) {
      if (!ok()) return;
      ctx.resume();
      clearTimeout(stopTimer);
      if (!timer) { step = 0; next = now() + .05; timer = setInterval(tick, 25); }
      bus.gain.cancelScheduledValues(now()); bus.gain.setTargetAtTime(vol, now(), .15);
    },
    stop(fade = .5) {
      if (!ctx) return;
      bus.gain.cancelScheduledValues(now()); bus.gain.setTargetAtTime(0, now(), Math.max(.01, fade / 3));
      clearTimeout(stopTimer);
      stopTimer = setTimeout(() => { clearInterval(timer); timer = null; }, fade * 1000 + 150);
    },
    duck(on) { if (ctx) duckG.gain.setTargetAtTime(on ? .35 : 1, now(), .08); },
    pop()   { if (ok()) tone(now(), 520, .09, { to: 1150, gain: .22, dest: sfx }); },
    whoosh(){ if (ok()) noise(now(), .45, { type: 'bandpass', freq: 350, to: 4200, q: 1.3, gain: .35, dest: sfx }); },
    ding()  { if (ok()) { tone(now(), 1320, .45, { gain: .16, dest: sfx }); tone(now(), 1980, .3, { gain: .07, dest: sfx }); } },
    stamp() { if (ok()) { tone(now(), 150, .3, { to: 45, gain: .8, dest: sfx }); noise(now(), .12, { type: 'lowpass', freq: 900, gain: .45, dest: sfx }); } },
    vine()  { if (ok()) { tone(now(), 85, .7, { to: 38, gain: .95, dest: sfx }); tone(now(), 170, .35, { to: 80, gain: .35, dest: sfx }); } },
    boom()  { if (ok()) { tone(now(), 95, 1.8, { to: 30, gain: 1, dest: sfx }); noise(now(), 2, { freq: 4500, gain: .28, dest: sfx }); } },
    riser(sec) {
      if (!ok()) return;
      const t = now(), s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
      const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 2;
      f.frequency.setValueAtTime(200, t); f.frequency.exponentialRampToValueAtTime(6000, t + sec);
      const g = ctx.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.3, t + sec);
      g.gain.linearRampToValueAtTime(0, t + sec + .05);

    scratch() {

      o.frequency.setValueAtTime(220, t); o.frequency.linearRampToValueAtTime(950, t + .12); o.frequency.linearRampToValueAtTime(140, t + .38);
      const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1200; f.Q.value = 1.5;
      const g = ctx.createGain(); g.gain.setValueAtTime(.3, t); g.gain.exponentialRampToValueAtTime(.0001, t + .4);
      o.connect(f); f.connect(g); g.connect(sfx); o.start(t); o.stop(t + .45);
      noise(t, .4, { type: 'bandpass', freq: 2000, to: 500, gain: .2, dest: sfx });
    },
    get ready() { return !!ctx; },
  };
})();

  wipeEl.className = 'cover';
  Music.whoosh();
  await sleep(T.wipe);
  swap();
  await sleep(T.wipeHold);
  wipeEl.className = 'reveal';
  Music.whoosh();
  await sleep(T.wipe);
  wipeEl.className = '';
}

async function sendMessage(m) {
  const c = CHARACTERS[m.from], ch = cast[m.from];
  if (m.fresh) talk.innerHTML = '';
  talk.querySelectorAll('.line').forEach((l) => l.classList.add('old'));

  // 1) Tokoh "mikir" + balon titik-titik
  const line = document.createElement('div');
  line.className = `line ${c.side}`;
  const typing = document.createElement('div');
  typing.className = 'bubble typing';
  typing.setAttribute('aria-label', `${c.name} sedang mengetik`);
  typing.innerHTML = '<i></i><i></i><i></i>';
  line.appendChild(typing);
  talk.appendChild(line);
  ch.classList.add('thinking');
  await sleep(typingDur(m));

  // 2) Balon teks pop-in + tokoh bicara dengan ekspresi
  const b = document.createElement('div');
  b.className = m.list ? 'bubble listcard' : 'bubble';
  b.innerHTML = `<div class="name">${c.name}<span class="tag">${c.tag}</span></div><div class="text"></div>`;
  b.querySelector('.text').textContent = m.text;
  if (m.list) {
    b.querySelector('.text').className = 'ltitle';
    const ul = document.createElement('ul');
    for (const it of m.list) {
      const li = document.createElement('li');
      li.innerHTML = `<span aria-hidden="true">${it.icon}</span><b></b>`;
      li.querySelector('b').textContent = it.text;
      ul.appendChild(li);
    }
    b.appendChild(ul);
  }
  typing.replaceWith(b);
  Music.pop();
  if (m.act === 'shock') Music.vine();
  ch.classList.remove('thinking');
  if (m.act) ch.classList.add(`act-${m.act}`);
  if (m.emote) { const e = document.createElement('div'); e.className = 'emote'; e.textContent = m.emote; ch.appendChild(e); }
  ch.classList.add('talking');

  const hold = holdDur(m);
  if (m.list) {
    // Poin tusi muncul satu per satu sambil Dinda membacakannya
    await Promise.all([sleep(600), speak(m.say || m.text, m.from)]);
    for (const [k, li] of [...b.querySelectorAll('li')].entries()) {
      li.classList.add('in');
      Music.ding();
      await Promise.all([sleep(T.listItemGap), speak(m.list[k].say || m.list[k].text, m.from)]);
    }
    ch.classList.remove('talking');
    await sleep(T.listHold);
    clearChar(ch);
    return;
  }
  // Mulut bergerak selama suara diputar (minimal talkMs), lalu sisa waktu baca
  const t0 = performance.now();
  const talkMs = clamp(m.text.length * T.talkPerChar, 600, hold - 300);
  await Promise.all([sleep(talkMs), speak(m.say || m.text, m.from, m.audio)]);
  ch.classList.remove('talking');
  const spent = (performance.now() - t0) * SPEED;
  await sleep(Math.max(500, hold - spent));
  clearChar(ch);
}

async function showOverlay(o, num) {
  overlay.querySelector('.oi').innerHTML = svg(o.icon, 1.8);
  overlay.querySelector('.onum b').textContent = num;
  overlay.querySelector('.otitle').textContent = o.title;
  overlay.querySelector('.osub').textContent = o.sub || '';
  overlay.classList.add('show');
  Music.whoosh();
  sleep(T.overlayIn + 150).then(() => Music.stamp(), () => {}); // saat stempel "BISA DI BHP" mendarat
  await Promise.all([
    sleep(T.overlayIn + T.overlayHold),
    sleep(T.overlayIn).then(() => speak(`Catat! Di BHP bisa: ${o.title}. ${o.sub || ''}`, 'narator')),
  ]);
}

async function climax(c) {
  // Hening 2 detik: layar meredup + zoom pelan
  cast.tasya.classList.add('act-shock');
  cast.dinda.classList.add('act-tilt');
  app.classList.add('dim');
  Music.stop(1.2); // musik hilang → hening
  if (!reduced()) world.classList.add('zoom');
  await sleep(T.silence);

  // Kepala Kantor muncul dari bawah
  const speech = boss.querySelector('.speech');
  speech.setAttribute('aria-label', `${c.speaker}: ${c.text}`);
  speech.innerHTML = c.text.split(/\s+/).map((w) =>
    `<span class="${c.emphasis?.includes(w) ? 'em' : ''}" aria-hidden="true">${w.replace(/</g, '&lt;')}</span>`).join('');
  boss.classList.add('in');
  await sleep(T.bossIn);

  // Dialog kata per kata, dibacakan suara Kepala Kantor
  const bossVoice = speak(c.say || c.text, 'boss', c.audio);
  Music.riser((speech.children.length * T.wordGap + T.afterWords) / 1000 / SPEED);
  for (const span of speech.children) { span.classList.add('in'); await sleep(T.wordGap); }
  await Promise.all([sleep(T.afterWords), bossVoice]);

  // Tagline besar + flash + shake, kedua tokoh melonjak
  tagline.querySelector('.t1').textContent = c.tagline[0];
  tagline.querySelector('.t2').textContent = c.tagline[1];
  Object.values(cast).forEach((ch) => { clearChar(ch); ch.classList.add('act-wow'); });
  if (!reduced()) {
    flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go');
    app.classList.remove('shake'); void app.offsetWidth; app.classList.add('shake');
  }
  tagline.classList.add('show');
  Music.boom(); Music.start(.9); // drop!
  await Promise.all([sleep(T.taglineHold), speak(c.tagline.join(' '), 'narator')]);

  // Freeze frame + record scratch
  app.classList.add('frozen');
  Music.scratch(); Music.stop(.05);
  await sleep(T.freeze);
}

async function showClosing() {
  setSegment(SCENES.length);
  await wipe('', () => {
    closingEl.hidden = false;
    closingEl.classList.remove('show'); void closingEl.offsetWidth; closingEl.classList.add('show');
    Music.start(.55);
  });
  await Promise.all([sleep(T.replayAfter),
    speak('Balai Harta Peninggalan Medan. Kementerian Hukum Republik Indonesia. Pasti selalu ada solusinya!', 'narator')]);
  replayBtn.hidden = false;
  replayBtn.focus({ preventScroll: true });
}

async function play(from = 0) {
  runId++;
  stopSpeech();
  Music.start(.8);
  replayBtn.hidden = true;
  try {
    for (let i = from; i < SCENES.length; i++) {
      const sc = SCENES[i];
      setSegment(i);
      await wipe(sc.label, () => {
        startEl.hidden = true;
        closingEl.hidden = true;
        setScene(sc);
      });
      await sleep(T.sceneIntro);
      for (const m of sc.messages) await sendMessage(m);
      if (sc.overlay) await showOverlay(sc.overlay, SCENES.slice(0, i + 1).filter((s) => s.overlay).length);
      if (sc.climax) await climax(sc.climax);
    }
    await showClosing();
  } catch (e) {
    if (e !== CANCEL) throw e;
  }
}

/* Tombol suara di layar awal + tombol M untuk mute */
const soundBtn = $('#soundBtn');
function updateSoundUi() {
  soundBtn.textContent = soundOn ? '🔊 Narator: ON' : '🔇 Narator: OFF';
  soundBtn.setAttribute('aria-pressed', String(soundOn));
  $('#voiceNote').textContent = !TTS ? 'Browser ini tidak mendukung suara.'
    : idVoice ? `Suara: ${idVoice.name}` : 'Suara Bahasa Indonesia belum terpasang di perangkat ini.';
}
soundBtn.addEventListener('click', () => { soundOn = !soundOn; if (!soundOn) stopSpeech(); updateSoundUi(); });
addEventListener('keydown', (e) => { if (e.key === 'm' || e.key === 'M') { soundOn = !soundOn; if (!soundOn) stopSpeech(); updateSoundUi(); } });
const musicBtn = $('#musicBtn');
musicBtn.addEventListener('click', () => {
  musicOn = !musicOn;
  if (!musicOn) Music.stop(.2);
  musicBtn.textContent = musicOn ? '🎵 Backsound: ON' : '🔇 Backsound: OFF';
  musicBtn.setAttribute('aria-pressed', String(musicOn));
});
if (TTS) { pickVoice(); speechSynthesis.addEventListener?.('voiceschanged', pickVoice); }
updateSoundUi();

$('#playBtn').addEventListener('click', () => play(START_AT));
replayBtn.addEventListener('click', () => play(0));
setScene(SCENES[0]);
</script>
