<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Kalender Kerja Wilayah II</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<!-- font dimuat tanpa menahan tampilan; di HP memakai font sistem agar lebih ringan -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" media="print" onload="if(matchMedia('(min-width:901px)').matches)this.media='all'">
<style>
:root{
  --bg:#f4f5fb; --bg2:#eceefa; --card:rgba(255,255,255,.72); --card-solid:#fff; --line:rgba(20,20,60,.08);
  --text:#16172b; --muted:#6b6f8a; --accent:#6d5dfc; --accent2:#22c3e6; --accent-soft:rgba(109,93,252,.12);
  --danger:#f0476b; --ok:#16b981; --warn:#f5a524; --shadow:0 10px 40px -12px rgba(40,30,120,.25);
  --r:18px; --blur:saturate(180%) blur(18px);
}
:root[data-theme=dark]{
  --bg:#0c0d17; --bg2:#12131f; --card:rgba(26,27,44,.72); --card-solid:#181a2b; --line:rgba(255,255,255,.08);
  --text:#eceefe; --muted:#9296b8; --accent-soft:rgba(109,93,252,.22); --shadow:0 10px 40px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;font-size:14px}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
  background:radial-gradient(40% 35% at 15% 10%,rgba(109,93,252,.28),transparent 70%),
             radial-gradient(35% 30% at 90% 15%,rgba(34,195,230,.22),transparent 70%),
             radial-gradient(40% 40% at 70% 95%,rgba(240,71,107,.14),transparent 70%);
  animation:aurora 22s ease-in-out infinite alternate}
@keyframes aurora{to{transform:translate3d(3%,-2%,0) rotate(6deg) scale(1.05)}}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.glass{background:var(--card);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--line);box-shadow:var(--shadow)}
.app{display:grid;grid-template-columns:290px 1fr;height:100dvh;gap:16px;padding:16px}
/* sidebar */
.side{border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:18px;overflow:auto}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:800;
  background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 20px -6px var(--accent)}
.brand b{display:block;font-size:15px}.brand small{color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:12px;font-weight:600;transition:.2s}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:linear-gradient(135deg,var(--accent),#8b7dff);color:#fff;box-shadow:0 8px 20px -8px var(--accent)}
.btn-ghost{background:var(--accent-soft);color:var(--accent)}
.btn-soft{background:var(--bg2);border:1px solid var(--line)}
.btn-danger{background:rgba(240,71,107,.12);color:var(--danger)}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;transition:.2s}
.icon-btn:hover{background:var(--accent-soft);color:var(--accent)}
.sec-title{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:8px}
.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:12px}
.mini span{padding:6px 0;border-radius:8px;cursor:pointer;position:relative}
.mini .h{color:var(--muted);font-weight:700;cursor:default}
.mini .o{opacity:.35}.mini .t{background:var(--accent);color:#fff;font-weight:700}
.mini span.has::after{content:"";position:absolute;bottom:2px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent2)}
.mini span:not(.h):hover{background:var(--accent-soft)}
.cats label{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:10px;cursor:pointer}
.cats label:hover{background:var(--accent-soft)}
.cats input{display:none}
.cats .sw{width:14px;height:14px;border-radius:5px;border:2px solid;transition:.2s}
.cats input:checked+.sw{background:currentColor}
.cats .n{margin-left:auto;color:var(--muted);font-size:12px}
.up{display:flex;flex-direction:column;gap:8px}
.up .it{display:flex;gap:10px;align-items:center;padding:8px;border-radius:12px;cursor:pointer}
.up .it:hover{background:var(--accent-soft)}
.up .d{width:40px;text-align:center;border-radius:10px;padding:4px 0;background:var(--bg2);font-size:11px;color:var(--muted)}
.up .d b{display:block;font-size:16px;color:var(--text)}
.up .it div:last-child{min-width:0}.up .it b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* main */
.main{display:flex;flex-direction:column;min-width:0;gap:14px}
.top{border-radius:20px;padding:10px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.top h1{font-size:22px;margin:0 8px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.top h1 span{color:var(--muted);font-weight:500}
.seg{display:flex;background:var(--bg2);border-radius:12px;padding:3px;border:1px solid var(--line)}
.seg button{padding:7px 12px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card-solid);color:var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.grow{flex:1}
.search{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:38px;min-width:200px}
.search input{border:0;background:none;outline:none;width:100%}
kbd{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted);background:var(--card-solid)}
.quick{border-radius:18px;padding:6px 6px 6px 16px;display:flex;align-items:center;gap:10px}
.quick input{flex:1;border:0;background:none;outline:none;padding:10px 0}
.quick .hint{font-size:12px;color:var(--muted)}
.view{flex:1;border-radius:24px;overflow:hidden;display:flex;flex-direction:column;min-height:0;position:relative}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;flex:none}
.avatar.sm{width:22px;height:22px;font-size:10px}
.live{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:pulse 2s infinite}
.live.off i{background:var(--warn);animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 8px transparent}}
/* month */
.dow{display:grid;grid-template-columns:repeat(7,1fr);padding:12px 12px 6px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.dow div{padding-left:10px}
.month{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;gap:6px;padding:0 12px 12px;min-height:0}
.cell{border-radius:14px;padding:6px;background:var(--card-solid);border:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-height:0;overflow:hidden;cursor:pointer;transition:.15s;position:relative}
.cell:hover{border-color:var(--accent);box-shadow:0 6px 18px -10px var(--accent)}
.cell.out{opacity:.45}.cell.we .num{color:var(--danger)}
.cell.drop{background:var(--accent-soft);border-color:var(--accent);border-style:dashed}
.cell .num{font-weight:700;font-size:13px;width:26px;height:26px;display:grid;place-items:center;border-radius:9px}
.cell{position:relative}.cell .shr{position:absolute;top:5px;right:22px;width:24px;height:24px;border-radius:8px;display:none;place-items:center;font-size:12px;background:var(--accent-soft);color:var(--accent)}
.cell:hover .shr{display:grid}@media (hover:none){.cell .shr{display:none!important}}
.share-btn{float:right;font-size:12px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--accent);background:var(--accent-soft);border-radius:10px;padding:5px 10px;margin-top:-5px}
.share-txt{width:100%;min-height:200px;margin-top:10px;font:14px/1.5 inherit;font-family:inherit;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--text);resize:vertical}
.share-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.share-acts .btn{flex:1 1 140px;justify-content:center}
.cell.today .num{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.cell .heat{position:absolute;top:10px;right:10px;display:flex;gap:2px}
.cell .heat i{width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:.5}
.chip{font-size:12px;padding:3px 7px;border-radius:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;border-left:3px solid;cursor:grab;flex:none}
.chip.done{text-decoration:line-through;opacity:.6}
.more{font-size:11px;color:var(--muted);padding-left:6px;font-weight:600}
/* week */
.week{flex:1;display:grid;grid-template-columns:repeat(7,minmax(140px,1fr));gap:8px;padding:12px;overflow:auto}
.wcol{background:var(--card-solid);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:300px}
.wcol.today{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.wcol h4{margin:0 0 4px;display:flex;justify-content:space-between;align-items:baseline}
.wcol h4 b{font-size:22px}
.card{border-radius:12px;padding:10px;border-left:4px solid;cursor:pointer;transition:.15s}
.card:hover{transform:translateY(-2px)}
.card b{display:block;margin-bottom:2px}.card small{color:var(--muted);display:block}
/* agenda & board */
.scroll{flex:1;overflow:auto;padding:16px}
.agday{display:grid;grid-template-columns:90px 1fr;gap:14px;margin-bottom:16px}
.agday .dt{position:sticky;top:0;align-self:start;text-align:center;padding:10px;border-radius:14px;background:var(--card-solid);border:1px solid var(--line)}
.agday .dt b{display:block;font-size:26px}.agday .dt small{color:var(--muted)}
.agday .list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--card-solid);border:1px solid var(--line);cursor:pointer}
.row:hover{border-color:var(--accent)}
.row .bar{width:4px;align-self:stretch;border-radius:4px}
.row .meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:12px;margin-top:3px}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap}
.board{flex:1;display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:12px;padding:12px;overflow:auto}
.lane{background:var(--bg2);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line)}
.lane.drop{outline:2px dashed var(--accent)}
.lane h4{margin:4px 6px 6px;display:flex;justify-content:space-between}
/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.kpi{padding:16px;border-radius:18px;background:var(--card-solid);border:1px solid var(--line)}
.kpi b{font-size:30px;display:block;letter-spacing:-.02em}.kpi small{color:var(--muted)}
.panel{padding:16px;border-radius:18px;background:var(--card-solid);border:1px solid var(--line);margin-top:12px}
.panel h3{margin:0 0 12px;font-size:15px}
.hbar{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:13px}
.hbar span:first-child{width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .tr{flex:1;height:10px;border-radius:10px;background:var(--bg2);overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:10px}
.heatmap{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px;overflow:auto;padding-bottom:4px}
.heatmap i{width:12px;height:12px;border-radius:3px;background:var(--bg2)}
.log{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.log .what{font-size:13px}.log small{color:var(--muted)}
.log pre{white-space:pre-wrap;font-size:11px;background:var(--bg2);padding:8px;border-radius:10px;margin:6px 0 0;max-height:140px;overflow:auto}
.todo-g h3{font-size:13px;margin:18px 0 8px;display:flex;gap:8px;align-items:center}
.todo{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--card-solid);border:1px solid var(--line);margin-bottom:6px}
.todo input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.todo.done .tt{text-decoration:line-through;color:var(--muted)}
.todo .tt{flex:1;min-width:0}.todo small{color:var(--muted);display:block;cursor:pointer}
.ai-doc{border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;background:var(--bg2)}
.ai-doc pre{white-space:pre-wrap;font-family:inherit;font-size:12px;background:var(--card-solid);padding:10px;border-radius:10px;max-height:180px;overflow:auto}
.ai-hero{border-radius:18px;padding:16px;margin-bottom:14px;color:#fff;background:linear-gradient(135deg,#6d5dfc,#e654c8,#22c3e6);background-size:200% 200%;animation:grad 6s ease infinite}
@keyframes grad{50%{background-position:100% 50%}}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,10,30,.45);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.show{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{width:min(760px,100%);max-height:92dvh;display:flex;flex-direction:column;border-radius:26px;background:var(--card-solid);border:1px solid var(--line);box-shadow:var(--shadow);animation:pop .25s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{from{transform:translateY(20px) scale(.97);opacity:0}}
.mh{padding:18px 20px 0;display:flex;align-items:center;gap:10px}
.mh h2{margin:0;font-size:18px;flex:1}
.tabs{display:flex;gap:4px;padding:12px 20px 0;border-bottom:1px solid var(--line);overflow:auto}
.tabs button{padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--accent);border-color:var(--accent)}
.mb{padding:18px 20px;overflow:auto;flex:1}
.mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
.f label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
.f input,.f select,.f textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);outline:none;transition:.2s}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.f textarea{min-height:90px;resize:vertical}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{padding:7px 12px;border-radius:20px;border:1px solid var(--line);font-weight:600;font-size:12px}
.pills button.on{color:#fff;border-color:transparent}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
.switch input{display:none}
.switch i{width:40px;height:22px;border-radius:20px;background:var(--line);position:relative;transition:.2s}
.switch i::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked+i{background:var(--accent)}.switch input:checked+i::after{left:20px}
.chk{display:flex;gap:8px;align-items:center;padding:6px 0}
.chk input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.chk input[type=text]{flex:1}
.chk.done span{text-decoration:line-through;color:var(--muted)}
.warn{padding:10px 12px;border-radius:12px;background:rgba(245,165,36,.14);color:#b77400;font-size:13px;margin-bottom:12px;display:none}
.drop-zone{border:2px dashed var(--line);border-radius:18px;padding:22px;text-align:center;color:var(--muted);transition:.2s;cursor:pointer}
.drop-zone.hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:14px}
.file{border-radius:14px;border:1px solid var(--line);overflow:hidden;background:var(--bg2);cursor:pointer;position:relative;transition:.2s}
.file:hover{transform:translateY(-2px);border-color:var(--accent)}
.file .th{height:92px;display:grid;place-items:center;font-size:30px;background-size:cover;background-position:center}
.file .nm{padding:8px;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file .nm small{display:block;color:var(--muted);font-weight:500}
.file .x{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:8px;background:rgba(0,0,0,.5);color:#fff;display:none;place-items:center}
.file:hover .x{display:grid}
.prog{height:6px;border-radius:6px;background:var(--bg2);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
.hover-card{position:fixed;z-index:80;width:300px;border-radius:16px;overflow:hidden;pointer-events:none;display:none;background:var(--card-solid);border:1px solid var(--line);box-shadow:var(--shadow)}
.hover-card img{width:100%;display:block;max-height:260px;object-fit:cover;background:var(--bg2)}
.hover-card div{padding:10px 12px;font-size:12px}
.viewer{position:fixed;inset:0;z-index:90;background:rgba(5,5,15,.88);display:none;flex-direction:column}
.viewer.show{display:flex}
.viewer header{display:flex;align-items:center;gap:10px;padding:12px 16px;color:#fff}
.viewer header b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viewer iframe,.viewer img{flex:1;border:0;width:100%;background:#111;object-fit:contain}
.viewer header a,.viewer header button{color:#fff}
.cmt{display:flex;gap:10px;margin-bottom:14px}
.cmt .bub{background:var(--bg2);padding:10px 12px;border-radius:4px 14px 14px 14px;flex:1}
.cmt small{color:var(--muted)}
.detail-hero{border-radius:18px;padding:16px;color:#fff;margin-bottom:14px}
.detail-hero h3{margin:6px 0;font-size:20px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;font-size:13px}
.kv span:nth-child(odd){color:var(--muted)}
/* palette & toast */
.palette{position:fixed;inset:0;z-index:95;background:rgba(10,10,30,.4);backdrop-filter:blur(3px);display:none;justify-content:center;padding-top:12vh}
.palette.show{display:flex}
.palette .box{width:min(620px,92vw);border-radius:20px;background:var(--card-solid);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;align-self:flex-start}
.palette input{width:100%;padding:18px 20px;border:0;outline:none;background:none;font-size:16px;border-bottom:1px solid var(--line)}
.palette .res{max-height:50vh;overflow:auto;padding:6px}
.palette .opt{padding:10px 14px;border-radius:12px;display:flex;gap:10px;align-items:center;cursor:pointer}
.palette .opt.on,.palette .opt:hover{background:var(--accent-soft)}
.palette .opt small{margin-left:auto;color:var(--muted)}
.toasts{position:fixed;bottom:20px;right:20px;z-index:99;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 16px;border-radius:14px;background:#1d1e33;color:#fff;box-shadow:var(--shadow);animation:pop .3s;display:flex;gap:10px;align-items:center;max-width:360px}
.toast button{color:#9d93ff;font-weight:700}
.loader{position:fixed;inset:0;display:grid;place-items:center;z-index:100;background:var(--bg)}
.loader div{width:46px;height:46px;border-radius:50%;border:4px solid var(--accent-soft);border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;color:var(--muted);padding:50px 20px}
.empty b{display:block;font-size:40px;margin-bottom:8px}
.fab,.bnav{display:none}
.now-badge{font-size:10px;font-weight:800;color:#fff;background:var(--danger);padding:2px 6px;border-radius:6px;animation:pulse 2s infinite}
/* mobile */
@media (max-width:900px){
  body{font-size:15px}
  .app{grid-template-columns:1fr;padding:10px 10px 84px;gap:10px}
  .side{display:none;position:fixed;inset:0 0 70px 0;z-index:40;border-radius:0 0 24px 24px}
  .side.open{display:flex;animation:fade .2s}
  .top{padding:8px}.top h1{font-size:18px;margin:0 4px;order:-1;flex:1}
  .top .hide-m{display:none}
  .search{min-width:0;flex:1;order:5;width:100%}
  .quick .hint{display:none}
  .dow{padding:8px 6px 4px}.dow div{padding:0;text-align:center}
  .month{gap:3px;padding:0 6px 6px}
  .cell{padding:3px;border-radius:10px;align-items:center}
  .cell .num{font-size:12px;width:24px;height:24px}
  .cell .chip{display:none}.cell .more{display:none}.cell .heat{position:static}
  .cell .heat i{width:6px;height:6px}
  .week{grid-template-columns:1fr;}
  .wcol{min-height:auto}
  .board{grid-template-columns:repeat(4,85vw);scroll-snap-type:x mandatory}.lane{scroll-snap-align:start}
  .agday{grid-template-columns:60px 1fr;gap:10px}
  .overlay{padding:0;align-items:flex-end}
  .modal{border-radius:26px 26px 0 0;max-height:94dvh;animation:sheet .3s cubic-bezier(.2,.9,.3,1)}
  @keyframes sheet{from{transform:translateY(100%)}}
  .grid2{grid-template-columns:1fr}
  .kv{grid-template-columns:100px 1fr}
  .fab{display:grid;position:fixed;right:18px;bottom:84px;width:58px;height:58px;border-radius:20px;z-index:30;place-items:center;color:#fff;font-size:28px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 12px 30px -8px var(--accent)}
  .bnav{display:flex;position:fixed;left:10px;right:10px;bottom:10px;height:62px;border-radius:22px;z-index:45;justify-content:space-around;align-items:center;padding-bottom:env(safe-area-inset-bottom)}
  .bnav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:700;color:var(--muted);padding:6px 10px;border-radius:14px}
  .bnav button.on{color:var(--accent);background:var(--accent-soft)}
  .bnav svg{width:22px;height:22px}
  .toasts{left:10px;right:10px;top:10px;bottom:auto} /* di atas: tidak menutupi tombol + dan menu bawah */
  /* bulan: grid ringkas + daftar hari terpilih memakai sisa layar */
  .month{flex:none;grid-template-rows:none!important;grid-auto-rows:44px}
  .cell{justify-content:flex-start}
  .cell.sel:not(.today) .num{background:var(--accent-soft);color:var(--accent)}
  .cell.sel{border-color:var(--accent)}
  .mobile-day{flex:1;min-height:0;overflow:auto;padding:10px 8px 90px;border-top:1px solid var(--line);-webkit-overflow-scrolling:touch}
  .mobile-day .row{padding:10px 12px}
  /* tambah cepat pindah ke form kegiatan baru */
  .quick{display:none}
  .top .today-m{display:grid}
  .f input,.f select,.f textarea,.search input,#cmt{font-size:16px} /* cegah zoom otomatis di iPhone */
  .side .views-m{display:grid}
  .side .close-m{display:grid}
  .side .mini-nav{display:flex}
  .mh h2:empty{display:none}.mh{justify-content:flex-end}
  .file .x{display:grid} /* layar sentuh tidak punya hover */
  .scroll{padding:12px 10px 90px}
  .tabs{scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
  /* ringan: matikan efek yang berat di GPU HP */
  body::before{animation:none;background:none}
  .glass,.overlay,.palette{backdrop-filter:none;-webkit-backdrop-filter:none}
  .glass{background:var(--card-solid);box-shadow:0 2px 10px -4px rgba(40,30,120,.18)}
  .cell:hover,.card:hover,.file:hover,.btn:hover{transform:none;box-shadow:none}
  .ai-hero{animation:none}
  .now-badge,.live i{animation:none}
}
.today-m,.views-m,.close-m{display:none}
@media (min-width:901px){.quick-m{display:none}}
.views-m{grid-template-columns:repeat(4,1fr);gap:6px}
.views-m button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);font-size:11px;font-weight:700;color:var(--muted)}
.views-m button.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.views-m b{font-size:18px}
.mini-nav{display:flex;align-items:center;justify-content:space-between}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (min-width:901px){.mobile-day{display:none}}
@media print{.side,.top,.quick,.bnav,.fab{display:none!important}.app{display:block}body{overflow:visible}}
.search svg{flex:none}
svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>

<div class="loader" id="loader"><div></div></div>

<div class="app">
  <aside class="side glass" id="side">
    <div class="brand">
      <div class="logo">W2</div>
      <div style="flex:1"><b>Kalender Kerja</b><small>Wilayah II</small></div>
      <button class="icon-btn close-m" onclick="toggleSide(false)" title="Tutup">✕</button>
    </div>
    <div class="views-m" id="viewsM">
      <button data-v="month"><b>📅</b>Bulan</button><button data-v="week"><b>🗓️</b>Minggu</button><button data-v="agenda"><b>📋</b>Agenda</button><button data-v="todo"><b>✅</b>To Do</button>
      <button data-v="board"><b>🧩</b>Papan</button><button data-v="stats"><b>📊</b>Statistik</button><button data-v="log"><b>📜</b>Log</button><button onclick="toggleSide(false);toggleTheme()"><b>🌓</b>Tema</button>
    </div>
    <button class="btn btn-primary" onclick="openForm()"><svg><path d="M12 5v14M5 12h14"/></svg>Kegiatan Baru</button>
    <div>
      <div class="mini-nav">
        <div class="sec-title" id="miniTitle" style="margin:0"></div>
        <div style="display:flex"><button class="icon-btn" onclick="shift(-1)">‹</button><button class="icon-btn" onclick="shift(1)">›</button></div>
      </div>
      <div class="mini" id="mini"></div>
    </div>
    <div>
      <div class="sec-title">Kategori</div>
      <div class="cats" id="cats"></div>
    </div>
    <div>
      <div class="sec-title">Filter</div>
      <label class="switch"><input type="checkbox" id="onlyMine" onchange="render()"><i></i>Hanya milik saya</label>
    </div>
    <div>
      <div class="sec-title">Akan Datang</div>
      <div class="up" id="upcoming"></div>
    </div>
    <div style="margin-top:auto;display:flex;flex-direction:column;gap:6px">
      <a class="btn btn-soft" id="driveLink" target="_blank">📁 Folder Google Drive</a>
      <a class="btn btn-soft" id="sheetLink" target="_blank">📊 Database &amp; Log (Sheets)</a>
    </div>
  </aside>

  <main class="main">
    <div class="top glass">
      <button class="icon-btn" onclick="shift(-1)" title="Sebelumnya (←)"><svg><path d="m15 18-6-6 6-6"/></svg></button>
      <button class="icon-btn" onclick="shift(1)" title="Berikutnya (→)"><svg><path d="m9 18 6-6-6-6"/></svg></button>
      <button class="btn btn-soft hide-m" onclick="goToday()">Hari ini</button>
      <button class="icon-btn today-m" onclick="goToday()" title="Hari ini"><svg><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M3 10h18"/><circle cx="12" cy="15" r="1.5"/></svg></button>
      <h1 id="title"></h1>
      <div class="seg hide-m" id="seg">
        <button data-v="month">Bulan</button><button data-v="week">Minggu</button><button data-v="agenda">Agenda</button><button data-v="todo">To Do</button>
        <button data-v="board">Papan</button><button data-v="stats">Statistik</button><button data-v="log">Log</button>
      </div>
      <div class="grow hide-m"></div>
      <div class="search"><svg><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="q" type="search" placeholder="Cari kegiatan, lokasi, orang…" oninput="clearTimeout(S.qt);S.qt=setTimeout(render,180)"><kbd class="hide-m">Ctrl K</kbd></div>
      <div class="live" id="live" title="Sinkron realtime"><i></i><span class="hide-m">Live</span></div>
      <button class="icon-btn" onclick="toggleTheme()" title="Tema"><svg><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
      <button class="icon-btn hide-m" onclick="openPalette()" title="Menu cepat"><svg><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></button>
      <div class="avatar" id="me"></div>
    </div>

    <div class="quick glass">
      <span>✨</span>
      <input id="quick" placeholder='Tambah cepat: "Rapat evaluasi besok 09:00-11:00 @Aula #Rapat !tinggi"' onkeydown="if(event.key==='Enter')quickAdd()">
      <span class="hint">Enter ↵</span>
      <button class="btn btn-primary" onclick="quickAdd()">Tambah</button>
    </div>

    <section class="view glass" id="view"></section>
  </main>
</div>

<button class="fab" onclick="openForm()">+</button>
<nav class="bnav glass" id="bnav">
  <button data-v="month"><svg><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Bulan</button>
  <button data-v="agenda"><svg><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Agenda</button>
  <button data-v="todo"><svg><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>To Do</button>
  <button data-v="stats"><svg><path d="M3 3v18h18M7 15l4-4 4 4 5-6"/></svg>Statistik</button>
  <button data-v="more" onclick="toggleSide()"><svg><path d="M4 6h16M4 12h16M4 18h16"/></svg>Menu</button>
</nav>

<!-- Modal kegiatan -->
<div class="overlay" id="ov" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>

<div class="hover-card" id="hover"></div>

  <header><b id="vTitle"></b><a id="vOpen" target="_blank" class="btn btn-soft" style="background:rgba(255,255,255,.1)">Buka di Drive ↗</a>
    <button class="icon-btn" onclick="closeViewer()">✕</button></header>
  <div id="vBody" style="flex:1;display:flex"></div>
</div>
